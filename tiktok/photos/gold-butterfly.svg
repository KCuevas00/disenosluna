<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldButterflyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#aa7a1e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="wingSheen" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#aa7a1e" stop-opacity="0.0" />
    </radialGradient>

    <filter id="butterflyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#451a03" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#butterflyShadow)">
    <!-- LEFT WING -->
    <g id="leftWing">
      <!-- Forewing Main Contour -->
      <path d="M 100,85 C 92,62 70,30 38,15 C 22,7 8,15 5,26 C 2,36 8,46 16,54 C 24,62 38,70 52,76 C 68,82 86,85 100,85 Z"
            fill="url(#wingSheen)" stroke="url(#goldButterflyGrad)" stroke-width="2.6" stroke-linejoin="round" />
      
      <!-- Forewing Internal Filigree Lace Veins -->
      <path d="M 100,85 C 80,72 58,55 35,32 C 26,23 20,20 12,25" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.8" />
      <path d="M 68,58 C 55,42 42,32 26,38" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.4" />
      <path d="M 78,68 C 65,58 50,52 35,58" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.3" />
      <path d="M 88,77 C 76,72 62,70 48,74" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />
      <!-- Discal Cell Arc -->
      <path d="M 95,82 C 84,70 70,64 58,66 C 54,75 62,82 75,84 Z" fill="url(#goldButterflyGrad)" fill-opacity="0.25" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />

      <!-- Hindwing Main Contour -->
      <path d="M 100,90 C 90,92 72,98 55,108 C 40,118 35,130 42,142 C 48,152 64,158 76,152 C 86,146 94,130 100,105 Z"
            fill="url(#wingSheen)" stroke="url(#goldButterflyGrad)" stroke-width="2.4" stroke-linejoin="round" />
      <!-- Hindwing Internal Veins -->
      <path d="M 98,96 C 85,110 72,125 58,142" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.5" />
      <path d="M 85,102 C 72,112 60,122 50,132" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />
      <path d="M 92,108 C 82,122 75,135 68,146" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />

      <!-- Gold Border Pearls / Scallop Accents -->
      <g fill="#fef08a" stroke="#78350f" stroke-width="0.5">
        <circle cx="10" cy="22" r="1.8" />
        <circle cx="16" cy="35" r="1.6" />
        <circle cx="25" cy="48" r="1.5" />
        <circle cx="36" cy="62" r="1.5" />
        <circle cx="44" cy="120" r="1.5" />
        <circle cx="50" cy="135" r="1.6" />
        <circle cx="62" cy="148" r="1.5" />
      </g>
    </g>

    <!-- RIGHT WING (Symmetrical Flip) -->
    <g id="rightWing" transform="translate(200, 0) scale(-1, 1)">
      <!-- Forewing Main Contour -->
      <path d="M 100,85 C 92,62 70,30 38,15 C 22,7 8,15 5,26 C 2,36 8,46 16,54 C 24,62 38,70 52,76 C 68,82 86,85 100,85 Z"
            fill="url(#wingSheen)" stroke="url(#goldButterflyGrad)" stroke-width="2.6" stroke-linejoin="round" />
      
      <!-- Forewing Internal Filigree Lace Veins -->
      <path d="M 100,85 C 80,72 58,55 35,32 C 26,23 20,20 12,25" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.8" />
      <path d="M 68,58 C 55,42 42,32 26,38" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.4" />
      <path d="M 78,68 C 65,58 50,52 35,58" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.3" />
      <path d="M 88,77 C 76,72 62,70 48,74" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />
      <!-- Discal Cell Arc -->
      <path d="M 95,82 C 84,70 70,64 58,66 C 54,75 62,82 75,84 Z" fill="url(#goldButterflyGrad)" fill-opacity="0.25" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />

      <!-- Hindwing Main Contour -->
      <path d="M 100,90 C 90,92 72,98 55,108 C 40,118 35,130 42,142 C 48,152 64,158 76,152 C 86,146 94,130 100,105 Z"
            fill="url(#wingSheen)" stroke="url(#goldButterflyGrad)" stroke-width="2.4" stroke-linejoin="round" />
      <!-- Hindwing Internal Veins -->
      <path d="M 98,96 C 85,110 72,125 58,142" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.5" />
      <path d="M 85,102 C 72,112 60,122 50,132" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />
      <path d="M 92,108 C 82,122 75,135 68,146" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.2" />

      <!-- Gold Border Pearls / Scallop Accents -->
      <g fill="#fef08a" stroke="#78350f" stroke-width="0.5">
        <circle cx="10" cy="22" r="1.8" />
        <circle cx="16" cy="35" r="1.6" />
        <circle cx="25" cy="48" r="1.5" />
        <circle cx="36" cy="62" r="1.5" />
        <circle cx="44" cy="120" r="1.5" />
        <circle cx="50" cy="135" r="1.6" />
        <circle cx="62" cy="148" r="1.5" />
      </g>
    </g>

    <!-- CENTRAL BUTTERFLY BODY -->
    <g id="body">
      <!-- Antennae -->
      <path d="M 98,68 C 94,48 85,32 72,18 C 70,16 66,18 68,22 C 76,32 86,46 96,68" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="71" cy="18" r="2.6" fill="#fef08a" stroke="#78350f" stroke-width="0.8" />

      <path d="M 102,68 C 106,48 115,32 128,18 C 130,16 134,18 132,22 C 124,32 114,46 104,68" fill="none" stroke="url(#goldButterflyGrad)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="129" cy="18" r="2.6" fill="#fef08a" stroke="#78350f" stroke-width="0.8" />

      <!-- Head -->
      <ellipse cx="100" cy="72" rx="4.5" ry="4" fill="url(#goldButterflyGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="98" cy="71" r="1.2" fill="#ffffff" />
      <circle cx="102" cy="71" r="1.2" fill="#ffffff" />

      <!-- Thorax -->
      <ellipse cx="100" cy="84" rx="5" ry="8" fill="url(#goldButterflyGrad)" stroke="#78350f" stroke-width="1" />
      <ellipse cx="100" cy="83" rx="2.5" ry="5.5" fill="#fef08a" opacity="0.6" />

      <!-- Abdomen -->
      <path d="M 96,92 C 95,108 97,128 100,136 C 103,128 105,108 104,92 Z" fill="url(#goldButterflyGrad)" stroke="#78350f" stroke-width="1" />
      <!-- Segment Ribs -->
      <line x1="96.5" y1="98" x2="103.5" y2="98" stroke="#fef08a" stroke-width="1" />
      <line x1="97" y1="104" x2="103" y2="104" stroke="#fef08a" stroke-width="1" />
      <line x1="97.5" y1="110" x2="102.5" y2="110" stroke="#fef08a" stroke-width="0.9" />
      <line x1="98" y1="116" x2="102" y2="116" stroke="#fef08a" stroke-width="0.9" />
      <line x1="98.5" y1="122" x2="101.5" y2="122" stroke="#fef08a" stroke-width="0.8" />
    </g>
  </g>
</svg>
