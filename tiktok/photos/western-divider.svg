<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 44" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="westDivGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbf0" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e9d5aa" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#e9d5aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fffbf0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divHatFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="45%" stop-color="#e9d5aa"/>
      <stop offset="100%" stop-color="#c9a86a"/>
    </linearGradient>
  </defs>

  <!-- Left Horizontal Filigree Line & Scrolls -->
  <line x1="20" y1="22" x2="190" y2="22" stroke="url(#westDivGold)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Left Scroll & Wheat Accent -->
  <path d="M 160,22 C 172,16 182,14 192,18 C 198,21 196,26 188,25" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="148" cy="19" rx="3" ry="1.5" transform="rotate(-25 148 19)" fill="#e9d5aa" stroke="#d4af37" stroke-width="0.8"/>
  <ellipse cx="134" cy="19" rx="3" ry="1.5" transform="rotate(-25 134 19)" fill="#e9d5aa" stroke="#d4af37" stroke-width="0.8"/>
  <circle cx="115" cy="22" r="1.5" fill="#d4af37"/>
  <!-- Left Twinkle Star -->
  <g transform="translate(178, 22) scale(0.55)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37"/>
  </g>

  <!-- Right Horizontal Filigree Line & Scrolls -->
  <line x1="270" y1="22" x2="440" y2="22" stroke="url(#westDivGold)" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Right Scroll & Wheat Accent -->
  <path d="M 300,22 C 288,16 278,14 268,18 C 262,21 264,26 272,25" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="312" cy="19" rx="3" ry="1.5" transform="rotate(25 312 19)" fill="#e9d5aa" stroke="#d4af37" stroke-width="0.8"/>
  <ellipse cx="326" cy="19" rx="3" ry="1.5" transform="rotate(25 326 19)" fill="#e9d5aa" stroke="#d4af37" stroke-width="0.8"/>
  <circle cx="345" cy="22" r="1.5" fill="#d4af37"/>
  <!-- Right Twinkle Star -->
  <g transform="translate(282, 22) scale(0.55)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════
       CENTER MOTIF: MINIMALIST CHIC COWGIRL HAT + SPARKLES
       ══════════════════════════════════════════════════════════ -->
  <g transform="translate(230, 22)">
    <!-- Crown -->
    <path d="M -12,4
             C -13,-4 -12,-11 -8,-15
             C -4,-18 0,-16 2,-14
             C 4,-16 8,-18 12,-15
             C 16,-11 17,-4 16,4 Z"
          fill="rgba(247, 240, 227, 0.25)" stroke="#d4af37" stroke-width="1.4" stroke-linejoin="round"/>
    <!-- Crown Dent -->
    <path d="M 2,-14 L 2,4" stroke="#c9a86a" stroke-width="1" stroke-dasharray="1 1.5"/>

    <!-- Hat Band with Little Heart -->
    <path d="M -13,4 C -6,2 6,2 17,4" stroke="#d4af37" stroke-width="1.8"/>
    <circle cx="2" cy="4" r="1.5" fill="#fffbf0"/>

    <!-- Wide Curled Brim -->
    <path d="M -26,8
             C -20,2 -6,-1 2,0
             C 10,-1 24,2 30,8
             C 24,14 12,16 2,16
             C -8,16 -20,14 -26,8 Z"
          fill="rgba(247, 240, 227, 0.15)" stroke="#d4af37" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M -22,8 C -10,12 2,13 14,13 C 20,13 24,10 26,8" stroke="#fffbf0" stroke-width="0.8" opacity="0.8"/>

    <!-- Top Sparkle Star Above Hat -->
    <g transform="translate(2, -22) scale(0.65)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>
  </g>
</svg>
