<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="discoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="35%" stop-color="#e9d5aa"/>
      <stop offset="70%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>
    <filter id="discoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4a3720" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g stroke="url(#discoGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#discoGlow)">
    <!-- Hanging String -->
    <line x1="100" y1="10" x2="100" y2="48" stroke-width="1.8"/>
    <!-- Top Cap Ring -->
    <ellipse cx="100" cy="48" rx="8" ry="3.5" stroke-width="1.6" fill="rgba(247, 240, 227, 0.2)"/>
    <circle cx="100" cy="44" r="2" fill="#fffbf0"/>

    <!-- Main Disco Sphere Outer Circle -->
    <circle cx="100" cy="120" r="70" stroke-width="2.6" fill="rgba(247, 240, 227, 0.05)"/>

    <!-- Latitude Rings (Curved horizontal rings of mirror facets) -->
    <ellipse cx="100" cy="68" rx="36" ry="7" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="100" cy="85" rx="55" ry="11" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="100" cy="102" rx="66" ry="14" stroke-width="1.4" opacity="0.8"/>
    <ellipse cx="100" cy="120" rx="70" ry="15" stroke-width="1.6" opacity="0.9"/>
    <ellipse cx="100" cy="138" rx="66" ry="14" stroke-width="1.4" opacity="0.8"/>
    <ellipse cx="100" cy="155" rx="55" ry="11" stroke-width="1.2" opacity="0.7"/>
    <ellipse cx="100" cy="172" rx="36" ry="7" stroke-width="1.2" opacity="0.6"/>

    <!-- Longitude Arcs (Vertical meridian lines) -->
    <path d="M 100,50 C 70,70 70,170 100,190" stroke-width="1.2" opacity="0.7"/>
    <path d="M 100,50 C 130,70 130,170 100,190" stroke-width="1.2" opacity="0.7"/>
    <path d="M 100,50 C 44,70 44,170 100,190" stroke-width="1.2" opacity="0.6"/>
    <path d="M 100,50 C 156,70 156,170 100,190" stroke-width="1.2" opacity="0.6"/>

    <!-- Shimmering Reflective Tiles (Filled Gold & Cream Highlights) -->
    <rect x="86" y="98" width="10" height="8" fill="#fffbf0" stroke-width="0.8"/>
    <rect x="108" y="104" width="11" height="9" fill="#d4af37" stroke-width="0.8"/>
    <rect x="74" y="116" width="11" height="9" fill="#e9d5aa" stroke-width="0.8"/>
    <rect x="96" y="126" width="12" height="9" fill="#fffbf0" stroke-width="0.8"/>
    <rect x="116" y="132" width="10" height="8" fill="#d4af37" stroke-width="0.8"/>
    <rect x="88" y="142" width="10" height="7" fill="#e9d5aa" stroke-width="0.8"/>

    <!-- Radiating Ray Bursts -->
    <line x1="28" y1="62" x2="16" y2="52" stroke-width="1.4"/>
    <line x1="172" y1="62" x2="184" y2="52" stroke-width="1.4"/>
    <line x1="24" y1="120" x2="10" y2="120" stroke-width="1.4"/>
    <line x1="176" y1="120" x2="190" y2="120" stroke-width="1.4"/>
    <line x1="32" y1="176" x2="22" y2="186" stroke-width="1.4"/>
    <line x1="168" y1="176" x2="178" y2="186" stroke-width="1.4"/>

    <!-- Sparkle Stars (✦) -->
    <g transform="translate(168, 86) scale(0.9)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>
    <g transform="translate(34, 142) scale(0.75)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>
    <circle cx="178" cy="156" r="1.3" fill="#e9d5aa"/>
    <circle cx="26" cy="94" r="1.2" fill="#e9d5aa"/>
  </g>
</svg>
