<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cornerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#d4af37" />
      <stop offset="90%" stop-color="#aa7a1e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <filter id="cornerGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#451a03" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cornerGlow)" stroke="url(#cornerGoldGrad)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Perpendicular Border Frame Lines with Dots -->
    <path d="M 12,145 L 12,12 L 145,12" stroke-width="2.6" />
    <path d="M 20,135 L 20,20 L 135,20" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.85" />

    <!-- Corner Finial Pearls -->
    <circle cx="12" cy="148" r="3.2" fill="url(#cornerGoldGrad)" stroke="#78350f" stroke-width="0.6" />
    <circle cx="148" cy="12" r="3.2" fill="url(#cornerGoldGrad)" stroke="#78350f" stroke-width="0.6" />

    <!-- Ornate Internal Baroque Scrollwork -->
    <path d="M 22,22 C 38,45 60,65 95,75 C 110,80 120,72 115,60 C 110,48 95,50 90,62 C 86,72 98,82 108,80" stroke-width="2.2" />
    <path d="M 22,22 C 45,38 65,60 75,95 C 80,110 72,120 60,115 C 48,110 50,95 62,90 C 72,86 82,98 80,108" stroke-width="2.2" />

    <!-- Corner Center Rosette / Fleuron -->
    <g transform="translate(42, 42)">
      <circle cx="0" cy="0" r="4.5" fill="url(#cornerGoldGrad)" stroke="#78350f" stroke-width="0.8" />
      <circle cx="-1" cy="-1" r="1.4" fill="#ffffff" />
      <path d="M -8,0 C -4,-6 4,-6 8,0 C 4,6 -4,6 -8,0 Z" fill="url(#cornerGoldGrad)" opacity="0.75" />
      <path d="M 0,-8 C -6,-4 -6,4 0,8 C 6,4 6,-4 0,-8 Z" fill="url(#cornerGoldGrad)" opacity="0.75" />
    </g>

    <circle cx="82" cy="30" r="2.2" fill="url(#cornerGoldGrad)" stroke="#78350f" stroke-width="0.5" />
    <circle cx="30" cy="82" r="2.2" fill="url(#cornerGoldGrad)" stroke="#78350f" stroke-width="0.5" />
  </g>
</svg>
