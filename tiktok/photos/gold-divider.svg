<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="100%" height="100%">
  <defs>
    <linearGradient id="filigreeGoldTaper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0" />
      <stop offset="15%" stop-color="#d4af37" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#d4af37" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </linearGradient>

    <!-- Royal Blue Sapphire Centerpiece Jewel -->
    <radialGradient id="royalSapphireJewel" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#1d4ed8" />
      <stop offset="90%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#091536" />
    </radialGradient>

    <radialGradient id="goldJewelBed" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <filter id="filigreeDropShadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#451a03" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#filigreeDropShadow)">
    <!-- Tapered Horizontal Accent Lines -->
    <line x1="20" y1="25" x2="195" y2="25" stroke="url(#filigreeGoldTaper)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="305" y1="25" x2="480" y2="25" stroke="url(#filigreeGoldTaper)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Left Scrollwork Flourishes -->
    <path d="M 160,25 C 175,25 185,12 202,15 C 215,18 220,30 234,24 C 224,18 214,21 206,25"
          fill="none" stroke="url(#filigreeGoldTaper)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 180,25 C 190,32 204,36 218,32 C 226,28 232,25 238,25"
          fill="none" stroke="#d4af37" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="162" cy="25" r="2" fill="#d4af37" />
    <circle cx="202" cy="15" r="2.4" fill="url(#goldJewelBed)" stroke="#78350f" stroke-width="0.5" />

    <!-- Right Scrollwork Flourishes (Mirrored) -->
    <path d="M 340,25 C 325,25 315,12 298,15 C 285,18 280,30 266,24 C 276,18 286,21 294,25"
          fill="none" stroke="url(#filigreeGoldTaper)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 320,25 C 310,32 296,36 282,32 C 274,28 268,25 262,25"
          fill="none" stroke="#d4af37" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="338" cy="25" r="2" fill="#d4af37" />
    <circle cx="298" cy="15" r="2.4" fill="url(#goldJewelBed)" stroke="#78350f" stroke-width="0.5" />

    <!-- Center Medallion: Baroque Gold Petals & Royal Blue Sapphire -->
    <!-- Gold Starburst / Diamond Petals -->
    <path d="M 250,9 L 254,19 L 266,25 L 254,31 L 250,41 L 246,31 L 234,25 L 246,19 Z"
          fill="url(#goldJewelBed)" stroke="#78350f" stroke-width="0.8" />
    <path d="M 250,13 L 253,20 L 261,25 L 253,30 L 250,37 L 247,30 L 239,25 L 247,20 Z"
          fill="#fffde7" />

    <!-- Royal Sapphire Cabochon Gem -->
    <circle cx="250" cy="25" r="6" fill="url(#royalSapphireJewel)" stroke="#fef08a" stroke-width="1.2" />
    <ellipse cx="248" cy="23" rx="1.8" ry="1.2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
