<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <linearGradient id="tealPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <radialGradient id="sealTealGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#0d9488" />
      <stop offset="75%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4aa63" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#042f2e" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.15" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#f8fafc" stroke="url(#goldTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#f0fdfa" opacity="0.9" />
  <polygon points="59,15 59,53 36,34" fill="#ede9fe" opacity="0.9" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#tealPocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#goldTrim)" stroke-width="0.7" opacity="0.8" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#tealFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#goldTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Mini Corner Floral & Butterfly Accents (Teal, Lavender & Gold) -->
  <circle cx="53" cy="11" r="3.2" fill="#0d9488" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#a855f7" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#fef08a" />
  <circle cx="57" cy="9" r="1.6" fill="#ffffff" />
  <circle cx="11" cy="53" r="3.2" fill="#0d9488" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#c084fc" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#d4aa63" />

  <!-- Teal Wax Seal Stamp with 'D & E' for Dayanari & Ebani -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="10.5" fill="url(#sealTealGold)" stroke="url(#goldTrim)" stroke-width="0.75" />
    <circle cx="32" cy="38" r="8.8" fill="none" stroke="#fef08a" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="7.5" font-weight="bold" fill="#fef08a" text-anchor="middle" dominant-baseline="central">D &amp; E</text>
  </g>
</svg>
