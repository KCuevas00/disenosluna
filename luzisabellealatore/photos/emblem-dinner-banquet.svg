<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#f5e19e"/>
    </linearGradient>
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c92a39" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7c0e18" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowGlass" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a1c0d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadowGlass)">
    <!-- Celebration Sparkles at Clink -->
    <path d="M 40 18 L 41.5 22.5 L 46 24 L 41.5 25.5 L 40 30 L 38.5 25.5 L 34 24 L 38.5 22.5 Z" fill="#d4af37"/>
    <circle cx="34" cy="18" r="1.3" fill="#d4af37"/>
    <circle cx="47" cy="19" r="1.5" fill="#d4af37"/>
    <circle cx="40" cy="12" r="1.2" fill="#d4af37"/>

    <!-- Left Glass (Tilted right ~12 deg) -->
    <g transform="rotate(12 33 46)">
      <!-- Bowl -->
      <path d="M 23 25 C 23 37, 39 37, 39 25 Z" fill="url(#wineGrad)" stroke="url(#goldGradGlass)" stroke-width="1.6"/>
      <!-- Liquid top surface -->
      <ellipse cx="31" cy="27" rx="7" ry="1.5" fill="#e8616f" fill-opacity="0.8"/>
      <!-- Stem -->
      <line x1="31" y1="37" x2="31" y2="54" stroke="url(#goldGradGlass)" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Base -->
      <ellipse cx="31" cy="54" rx="9" ry="2.2" fill="url(#goldGradGlass)"/>
    </g>

    <!-- Right Glass (Tilted left ~-12 deg) -->
    <g transform="rotate(-12 47 46)">
      <!-- Bowl -->
      <path d="M 41 25 C 41 37, 57 37, 57 25 Z" fill="url(#wineGrad)" stroke="url(#goldGradGlass)" stroke-width="1.6"/>
      <!-- Liquid top surface -->
      <ellipse cx="49" cy="27" rx="7" ry="1.5" fill="#e8616f" fill-opacity="0.8"/>
      <!-- Stem -->
      <line x1="49" y1="37" x2="49" y2="54" stroke="url(#goldGradGlass)" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Base -->
      <ellipse cx="49" cy="54" rx="9" ry="2.2" fill="url(#goldGradGlass)"/>
    </g>

    <!-- Base Laurel Branch Flourish Below Glasses -->
    <path d="M 22 66 C 31 63, 49 63, 58 66" fill="none" stroke="url(#goldGradGlass)" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="40" cy="63.5" r="1.8" fill="#a31d24"/>
  </g>
</svg>
