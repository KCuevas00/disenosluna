<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradDress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4d4"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#e8cf78"/>
    </linearGradient>
    <radialGradient id="sparkleDress" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowDress" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a1c0d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadowDress)">
    <!-- Ornate Hanger Hook -->
    <path d="M 40 16 C 44 16, 47 19, 47 23 C 47 26.5, 44 28.5, 41 30 L 40 33" 
          fill="none" stroke="url(#goldGradDress)" stroke-width="2.4" stroke-linecap="round"/>
    
    <!-- Fine Hanger Shoulders with Scroll Finials -->
    <path d="M 16 46 C 22 41, 31 36, 40 33 C 49 36, 58 41, 64 46" 
          fill="none" stroke="url(#goldGradDress)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="16" cy="46" r="2.2" fill="url(#goldGradDress)"/>
    <circle cx="64" cy="46" r="2.2" fill="url(#goldGradDress)"/>
    
    <!-- Cross Bar -->
    <line x1="20" y1="46" x2="60" y2="46" stroke="url(#goldGradDress)" stroke-width="1.4" stroke-dasharray="1 2"/>

    <!-- Black Tie / Bowtie Silhouette Suspended Below -->
    <!-- Left Wing -->
    <path d="M 40 50 L 30 43 C 27 45, 27 55, 30 57 Z" fill="#141414" stroke="url(#goldGradDress)" stroke-width="1.2"/>
    <!-- Right Wing -->
    <path d="M 40 50 L 50 43 C 53 45, 53 55, 50 57 Z" fill="#141414" stroke="url(#goldGradDress)" stroke-width="1.2"/>
    <!-- Knot -->
    <rect x="37.5" y="47.5" width="5" height="5.5" rx="1.5" fill="#a31d24" stroke="url(#goldGradDress)" stroke-width="1"/>

    <!-- Gown / Tail Drapery Accent -->
    <path d="M 37 53 C 34 60, 31 67, 28 72" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 43 53 C 46 60, 49 67, 52 72" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Little Sparkles -->
    <circle cx="21" cy="28" r="1.5" fill="#d4af37"/>
    <circle cx="59" cy="28" r="1.5" fill="#d4af37"/>
  </g>
</svg>
