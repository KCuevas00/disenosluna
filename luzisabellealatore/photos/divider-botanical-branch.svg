<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" width="100%" height="100%">
  <defs>
    <linearGradient id="botGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8022" stop-opacity="0"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff5d1"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8022" stop-opacity="0"/>
    </linearGradient>
    <filter id="botShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#400408" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#botShadow)">
    <!-- Fine Baseline Taper -->
    <line x1="30" y1="20" x2="210" y2="20" stroke="url(#botGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="290" y1="20" x2="470" y2="20" stroke="url(#botGold)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left Botanical Sprig Leaves -->
    <path d="M 210 20 C 220 20, 232 17, 240 20" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Leaf 1 -->
    <path d="M 220 20 C 222 14, 228 13, 230 17 C 227 19, 223 20, 220 20 Z" fill="#d4af37" fill-opacity="0.9"/>
    <!-- Leaf 2 -->
    <path d="M 228 20 C 230 25, 236 26, 238 22 C 235 21, 231 20, 228 20 Z" fill="#aa8022" fill-opacity="0.9"/>
    <!-- Leaf 3 -->
    <path d="M 235 19 C 238 13, 244 14, 245 18 C 242 19, 238 19, 235 19 Z" fill="#d4af37" fill-opacity="0.9"/>

    <!-- Right Botanical Sprig Leaves (Mirrored) -->
    <path d="M 290 20 C 280 20, 268 17, 260 20" fill="none" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Leaf 1 -->
    <path d="M 280 20 C 278 14, 272 13, 270 17 C 273 19, 277 20, 280 20 Z" fill="#d4af37" fill-opacity="0.9"/>
    <!-- Leaf 2 -->
    <path d="M 272 20 C 270 25, 264 26, 262 22 C 265 21, 269 20, 272 20 Z" fill="#aa8022" fill-opacity="0.9"/>
    <!-- Leaf 3 -->
    <path d="M 265 19 C 262 13, 256 14, 255 18 C 258 19, 262 19, 265 19 Z" fill="#d4af37" fill-opacity="0.9"/>

    <!-- Center Fleur-de-lis / Rose Bud Accent -->
    <circle cx="250" cy="20" r="3.6" fill="#a31d24" stroke="#d4af37" stroke-width="1"/>
    <circle cx="249" cy="19" r="0.9" fill="#fff"/>
    <circle cx="244" cy="20" r="1.5" fill="#d4af37"/>
    <circle cx="256" cy="20" r="1.5" fill="#d4af37"/>
  </g>
</svg>
