<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 52" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="25%" stop-color="#e8c365"/>
      <stop offset="60%" stop-color="#c99e34"/>
      <stop offset="100%" stop-color="#8c671a"/>
    </linearGradient>
    <linearGradient id="pinGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="goldPinShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4a3014" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#goldPinShadow)">
    <!-- Pure Golden Location Pin Silhouette with transparent center aperture -->
    <path d="M 24 3 C 14.61 3, 7 10.61, 7 20 C 7 31.8, 24 47, 24 47 C 24 47, 41 31.8, 41 20 C 41 10.61, 33.39 3, 24 3 Z M 24 13 C 27.87 13, 31 16.13, 31 20 C 31 23.87, 27.87 27, 24 27 C 20.13 27, 17 23.87, 17 20 C 17 16.13, 20.13 13, 24 13 Z"
          fill="url(#goldGradPin)" 
          stroke="#8c671a" 
          stroke-width="1.2" 
          stroke-linejoin="round"
          fill-rule="evenodd" />
    <!-- Delicate Top Arch Specular Highlight -->
    <path d="M 11 19 C 11 12.8, 16.8 7, 24 7 C 31.2 7, 37 12.8, 37 19" 
          fill="none" 
          stroke="url(#pinGleam)" 
          stroke-width="1.4" 
          stroke-linecap="round" />
  </g>
</svg>
