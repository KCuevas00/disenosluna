<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f0fa" />
    </linearGradient>
    <linearGradient id="bluePocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eaf7" />
      <stop offset="100%" stop-color="#bde0f5" />
    </linearGradient>
    <radialGradient id="sealBabyBlueSilver" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#bce3fa" />
      <stop offset="75%" stop-color="#7abde6" />
      <stop offset="100%" stop-color="#509fd4" />
    </radialGradient>
    <linearGradient id="silverTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#1e3a5f" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.1" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#f0f7fc" stroke="url(#silverTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#d9ecf8" />
  <polygon points="59,15 59,53 36,34" fill="#cbe4f5" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#bluePocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#silverTrim)" stroke-width="0.7" opacity="0.8" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#blueFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#silverTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Mini Corner Floral Sprays -->
  <circle cx="53" cy="11" r="3.2" fill="#a8d8f8" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#8bc9f3" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#cbd5e1" />
  <circle cx="57" cy="9" r="1.6" fill="#94a3b8" />
  <circle cx="11" cy="53" r="3.2" fill="#a8d8f8" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#8bc9f3" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#cbd5e1" />

  <!-- Baby Blue & Silver Wax Seal Stamp with 'W' -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="9.5" fill="url(#sealBabyBlueSilver)" stroke="url(#silverTrim)" stroke-width="0.75" />
    <circle cx="32" cy="38" r="7.8" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.75" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">W</text>
  </g>
</svg>
