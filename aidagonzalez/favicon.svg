<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="silverFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="silverPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <radialGradient id="sealNavy" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3b5998" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#0f2347" />
      <stop offset="100%" stop-color="#081329" />
    </radialGradient>
    <linearGradient id="silverTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#081329" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="5" y="15" width="54" height="38" rx="4" fill="#081329" opacity="0.22" transform="translate(0, 2)" />
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#ffffff" stroke="url(#silverTrim)" stroke-width="0.9" />

  <polygon points="5,15 5,53 28,34" fill="#f8fafc" opacity="0.95" />
  <polygon points="59,15 59,53 36,34" fill="#e2e8f0" opacity="0.95" />

  <polygon points="5,53 59,53 32,34" fill="url(#silverPocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#silverTrim)" stroke-width="0.8" opacity="0.9" />

  <polygon points="5,15 59,15 32,38" fill="url(#silverFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#silverTrim)" stroke-width="0.95" opacity="0.95" />

  <!-- Mini Navy & Silver Corner Accents -->
  <circle cx="53" cy="11" r="3.2" fill="#1e3a8a" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#94a3b8" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#cbd5e1" />
  <circle cx="57" cy="9" r="1.6" fill="#ffffff" />
  <circle cx="11" cy="53" r="3.2" fill="#1e3a8a" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#94a3b8" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#cbd5e1" />

  <!-- Navy Blue & Silver Wax Seal Stamp -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="10.5" fill="url(#sealNavy)" stroke="url(#silverTrim)" stroke-width="0.85" />
    <circle cx="32" cy="38" r="8.8" fill="none" stroke="#e2e8f0" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="9" font-weight="bold" fill="#f8fafc" text-anchor="middle" dominant-baseline="central">A</text>
  </g>
</svg>
