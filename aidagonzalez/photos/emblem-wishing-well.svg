<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="silverGradEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="navySealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4a8f"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowEnv" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadowEnv)">
    <rect x="18" y="26" width="44" height="32" rx="4" fill="#ffffff" stroke="url(#silverGradEnv)" stroke-width="2"/>

    <path d="M 19 28 L 40 44 L 61 28" fill="none" stroke="url(#silverGradEnv)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 19 57 L 33 42" fill="none" stroke="url(#silverGradEnv)" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 61 57 L 47 42" fill="none" stroke="url(#silverGradEnv)" stroke-width="1.1" stroke-linecap="round"/>

    <line x1="18" y1="42" x2="62" y2="42" stroke="url(#silverGradEnv)" stroke-width="1" stroke-dasharray="2 2"/>

    <circle cx="40" cy="44" r="9" fill="url(#navySealGrad)" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="40" cy="44" r="7.2" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-dasharray="1 1.2"/>
    <path d="M 40 39 L 41.2 42.3 L 44.5 43.5 L 41.2 44.7 L 40 48 L 38.8 44.7 L 35.5 43.5 L 38.8 42.3 Z" fill="#f8fafc"/>

    <!-- Silver Star Sparkle Floating Out of Envelope -->
    <path d="M 40 12 L 42.2 17.8 L 48 20 L 42.2 22.2 L 40 28 L 37.8 22.2 L 32 20 L 37.8 17.8 Z"
          fill="#1e3a8a" stroke="url(#silverGradEnv)" stroke-width="1"/>

    <circle cx="25" cy="20" r="1.4" fill="#94a3b8"/>
    <circle cx="55" cy="21" r="1.6" fill="#94a3b8"/>
  </g>
</svg>
