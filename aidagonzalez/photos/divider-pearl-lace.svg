<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 44" width="100%" height="100%">
  <defs>
    <linearGradient id="celestialLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#cbd5e1" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#cbd5e1" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <filter id="starGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#93c5fd" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#starGlow)">
    <line x1="25" y1="22" x2="205" y2="22" stroke="url(#celestialLine)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="295" y1="22" x2="475" y2="22" stroke="url(#celestialLine)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left Constellation Stars -->
    <circle cx="178" cy="22" r="1.2" fill="#cbd5e1"/>
    <circle cx="195" cy="17" r="1.5" fill="#e2e8f0"/>
    <path d="M 218 14 L 220 20 L 226 22 L 220 24 L 218 30 L 216 24 L 210 22 L 216 20 Z" fill="#e2e8f0"/>
    <circle cx="233" cy="22" r="1.6" fill="#ffffff"/>

    <!-- Center Crescent Moon & North Star -->
    <path d="M 254 11 A 11 11 0 1 0 254 33 A 8.5 8.5 0 1 1 254 11 Z" fill="#f8fafc"/>
    <path d="M 256 17 L 257.6 21 L 261.6 22.5 L 257.6 24 L 256 28 L 254.4 24 L 250.4 22.5 L 254.4 21 Z" fill="#bfdbfe"/>

    <!-- Right Constellation Stars (Mirrored) -->
    <circle cx="269" cy="22" r="1.6" fill="#ffffff"/>
    <path d="M 282 14 L 284 20 L 290 22 L 284 24 L 282 30 L 280 24 L 274 22 L 280 20 Z" fill="#e2e8f0"/>
    <circle cx="305" cy="17" r="1.5" fill="#e2e8f0"/>
    <circle cx="322" cy="22" r="1.2" fill="#cbd5e1"/>
  </g>
</svg>
