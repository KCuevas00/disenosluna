<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Liquid Silver & Platinum Gradient -->
    <linearGradient id="masqSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#f1f4f9"/>
      <stop offset="48%" stop-color="#cbd5e1"/>
      <stop offset="72%" stop-color="#94a3b8"/>
      <stop offset="92%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e222a"/>
    </linearGradient>

    <!-- Royal Lavender Glow Accent -->
    <linearGradient id="masqLavender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d8b4fe"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Deep Noir Shadow -->
    <filter id="maskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g stroke="url(#masqSilver)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#maskGlow)">
    <!-- ════════════ LEFT ORNAMENTAL FILIGREE SCROLLS ════════════ -->
    <path d="M 50,75 C 80,75 105,52 132,52 C 160,52 184,76 204,76 C 214,76 220,68 218,60 C 215,50 204,48 195,56 C 185,64 190,78 202,80 C 216,82 226,65 228,55" stroke-width="2.2"/>
    <path d="M 80,75 C 110,75 135,36 172,39 C 190,41 200,54 196,64" stroke-width="1.4" opacity="0.75"/>
    <path d="M 32,78 C 42,78 46,72 42,68 C 36,63 28,70 34,79 C 43,89 65,85 92,75" stroke-width="1.5"/>
    <path d="M 125,52 C 145,35 175,28 198,34" stroke-width="1.2" opacity="0.6"/>

    <!-- ════════════ RIGHT ORNAMENTAL FILIGREE SCROLLS ════════════ -->
    <path d="M 450,75 C 420,75 395,52 368,52 C 340,52 316,76 296,76 C 286,76 280,68 282,60 C 285,50 296,48 305,56 C 315,64 310,78 298,80 C 284,82 274,65 272,55" stroke-width="2.2"/>
    <path d="M 420,75 C 390,75 365,36 328,39 C 310,41 300,54 304,64" stroke-width="1.4" opacity="0.75"/>
    <path d="M 468,78 C 458,78 454,72 458,68 C 464,63 472,70 466,79 C 457,89 435,85 408,75" stroke-width="1.5"/>
    <path d="M 375,52 C 355,35 325,28 302,34" stroke-width="1.2" opacity="0.6"/>

    <!-- ════════════ CENTER VENETIAN MASQUERADE MASK ════════════ -->
    <!-- Mask Main Silhouette Outer Contour (Left & Right Winged Cat-Eye Temples) -->
    <path d="M 250,56
             C 245,50 236,44 225,44
             C 212,44 204,52 201,62
             C 198,71 206,84 222,86
             C 232,87 241,80 250,68
             C 259,80 268,87 278,86
             C 294,84 302,71 299,62
             C 296,52 288,44 275,44
             C 264,44 255,50 250,56 Z"
          fill="rgba(15, 13, 19, 0.82)" stroke="url(#masqSilver)" stroke-width="2.4"/>

    <!-- Left Almond Eye Cutout -->
    <path d="M 215,65 Q 225,58 235,66 Q 225,74 215,65 Z" fill="#ffffff" stroke="url(#masqSilver)" stroke-width="1.4"/>
    <ellipse cx="225" cy="65.5" rx="7" ry="3.5" fill="#121018"/>

    <!-- Right Almond Eye Cutout -->
    <path d="M 265,66 Q 275,58 285,65 Q 275,74 265,66 Z" fill="#ffffff" stroke="url(#masqSilver)" stroke-width="1.4"/>
    <ellipse cx="275" cy="65.5" rx="7" ry="3.5" fill="#121018"/>

    <!-- Center Bridge Crown Tiara Crest & Feather Plume Peak -->
    <path d="M 250,22 Q 248,38 250,54" stroke="url(#masqSilver)" stroke-width="2"/>
    <path d="M 250,22 C 242,32 238,44 246,54" stroke="url(#masqSilver)" stroke-width="1.3" opacity="0.85"/>
    <path d="M 250,22 C 258,32 262,44 254,54" stroke="url(#masqSilver)" stroke-width="1.3" opacity="0.85"/>

    <!-- Top Plume Jewels -->
    <circle cx="250" cy="20" r="3.2" fill="url(#masqLavender)" stroke="url(#masqSilver)" stroke-width="1.2"/>
    <circle cx="250" cy="36" r="2.2" fill="#ffffff"/>
    <circle cx="243" cy="30" r="1.6" fill="url(#masqSilver)"/>
    <circle cx="257" cy="30" r="1.6" fill="url(#masqSilver)"/>

    <!-- Brow Filigree Lace Vines (Left) -->
    <path d="M 226,44 C 220,38 212,38 206,44 C 201,48 204,55 210,54" stroke="url(#masqSilver)" stroke-width="1.3"/>
    <path d="M 235,46 Q 242,42 248,48" stroke="url(#masqSilver)" stroke-width="1.2" opacity="0.75"/>
    <circle cx="206" cy="44" r="1.5" fill="url(#masqSilver)"/>

    <!-- Brow Filigree Lace Vines (Right) -->
    <path d="M 274,44 C 280,38 288,38 294,44 C 299,48 296,55 290,54" stroke="url(#masqSilver)" stroke-width="1.3"/>
    <path d="M 265,46 Q 258,42 252,48" stroke="url(#masqSilver)" stroke-width="1.2" opacity="0.75"/>
    <circle cx="294" cy="44" r="1.5" fill="url(#masqSilver)"/>

    <!-- Lower Cheek Lace Accents -->
    <path d="M 220,80 Q 226,76 232,80" stroke="url(#masqSilver)" stroke-width="1" opacity="0.8"/>
    <path d="M 280,80 Q 274,76 268,80" stroke="url(#masqSilver)" stroke-width="1" opacity="0.8"/>
    <circle cx="250" cy="62" r="1.8" fill="url(#masqLavender)" stroke="url(#masqSilver)" stroke-width="0.8"/>
  </g>
</svg>
