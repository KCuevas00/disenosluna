<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 36" width="100%" height="100%">
  <defs>
    <linearGradient id="pearlGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8022" stop-opacity="0"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff5d1"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8022" stop-opacity="0"/>
    </linearGradient>
    <filter id="pearlShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#400408" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#pearlShadow)">
    <line x1="30" y1="18" x2="215" y2="18" stroke="url(#pearlGold)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="285" y1="18" x2="470" y2="18" stroke="url(#pearlGold)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left Graduated Pearl Drops -->
    <circle cx="218" cy="18" r="1.6" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="225" cy="18" r="2.2" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="233" cy="18" r="2.8" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="241" cy="18" r="3.2" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>

    <!-- Right Graduated Pearl Drops (Mirrored) -->
    <circle cx="282" cy="18" r="1.6" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="275" cy="18" r="2.2" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="267" cy="18" r="2.8" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="259" cy="18" r="3.2" fill="#fdfbf7" stroke="#d4af37" stroke-width="0.8"/>

    <!-- Center Radiant Diamond Starburst with Ruby Core -->
    <path d="M 250 8 L 252.5 15.5 L 260 18 L 252.5 20.5 L 250 28 L 247.5 20.5 L 240 18 L 247.5 15.5 Z" fill="#d4af37"/>
    <circle cx="250" cy="18" r="3.5" fill="#a31d24" stroke="#d4af37" stroke-width="0.8"/>
    <circle cx="249" cy="17" r="0.9" fill="#ffffff"/>
  </g>
</svg>
