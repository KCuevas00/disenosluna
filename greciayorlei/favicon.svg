<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lavenderFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f8fc" />
    </linearGradient>
    <linearGradient id="lavenderPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8fc" />
      <stop offset="100%" stop-color="#e6e6fa" />
    </linearGradient>
    <radialGradient id="sealLavenderSilver" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#d3d3ff" />
      <stop offset="75%" stop-color="#8c8cd0" />
      <stop offset="100%" stop-color="#161622" />
    </radialGradient>
    <linearGradient id="silverTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#b4b8c8" />
      <stop offset="100%" stop-color="#686c7c" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#161622" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.14" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#fcfcff" stroke="url(#silverTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#f8f8fc" opacity="0.9" />
  <polygon points="59,15 59,53 36,34" fill="#e6e6fa" opacity="0.9" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#lavenderPocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#silverTrim)" stroke-width="0.7" opacity="0.8" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#lavenderFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#silverTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Mini Corner Floral Accents (#D3D3FF Lavender & Silver) -->
  <circle cx="53" cy="11" r="3.2" fill="#8c8cd0" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#d3d3ff" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#eff0f8" />
  <circle cx="57" cy="9" r="1.6" fill="#ffffff" />
  <circle cx="11" cy="53" r="3.2" fill="#8c8cd0" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#d3d3ff" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#b4b8c8" />

  <!-- Wax Seal Stamp with 'G' for Grecia -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="10.5" fill="url(#sealLavenderSilver)" stroke="url(#silverTrim)" stroke-width="0.75" />
    <circle cx="32" cy="38" r="8.8" fill="none" stroke="#eff0f8" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">G</text>
  </g>
</svg>
