<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="whiteFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f5f4" />
    </linearGradient>
    <linearGradient id="whitePocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9" />
      <stop offset="100%" stop-color="#e7e5e4" />
    </linearGradient>
    <radialGradient id="sealCrimsonGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="35%" stop-color="#be123c" />
      <stop offset="75%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4aa63" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#4c0519" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.15" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#f8fafc" stroke="url(#goldTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#f1f5f9" opacity="0.9" />
  <polygon points="59,15 59,53 36,34" fill="#e2e8f0" opacity="0.9" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#whitePocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#goldTrim)" stroke-width="0.7" opacity="0.8" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#whiteFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#goldTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Mini Corner Floral Sprays (Red Roses & Gold Leaves) -->
  <circle cx="53" cy="11" r="3.2" fill="#be123c" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#ca8a04" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#fef08a" />
  <circle cx="57" cy="9" r="1.6" fill="#ffffff" />
  <circle cx="11" cy="53" r="3.2" fill="#be123c" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#ca8a04" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#15803d" />

  <!-- Crimson Wax Seal Stamp with 'S' for Sophia -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="9.5" fill="url(#sealCrimsonGold)" stroke="url(#goldTrim)" stroke-width="0.75" />
    <circle cx="32" cy="38" r="7.8" fill="none" stroke="#fef08a" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle" dominant-baseline="central">S</text>
  </g>
</svg>
