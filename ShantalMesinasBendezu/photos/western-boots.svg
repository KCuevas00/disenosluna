<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bootGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="35%" stop-color="#e9d5aa"/>
      <stop offset="70%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>
    <filter id="bootShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4a3720" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g stroke="url(#bootGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#bootShadow)">

    <!-- ══════════════════════════════════════════════════════════
         BACK BOOT (Slightly to the Left and Back)
         ══════════════════════════════════════════════════════════ -->
    <g opacity="0.82" transform="translate(-16, -6)">
      <!-- Scalloped Collar Rim -->
      <path d="M 68,36 C 82,46 102,46 116,36" stroke-width="2.2"/>
      <!-- Boot Shaft -->
      <path d="M 68,36 L 76,146 C 76,156 68,166 60,172 L 44,180 C 38,184 38,190 48,190 L 108,190 C 118,190 126,176 126,160 L 116,36" stroke-width="2.2" fill="rgba(247, 240, 227, 0.04)"/>
      <!-- Sole & Heel -->
      <path d="M 108,190 L 106,206 L 90,206 L 94,190" stroke-width="2" fill="rgba(247, 240, 227, 0.08)"/>
      <path d="M 46,190 C 64,193 88,193 108,190" stroke-width="2"/>
    </g>

    <!-- ══════════════════════════════════════════════════════════
         FRONT BOOT (Main Foreground Hero Boot)
         ══════════════════════════════════════════════════════════ -->
    <!-- Scalloped Top Collar with Pull Straps -->
    <!-- Collar Curve -->
    <path d="M 106,42
             C 120,54 146,54 162,42"
          stroke-width="2.6"/>
    <path d="M 106,46
             C 120,58 146,58 162,46"
          stroke-width="1.2" opacity="0.7"/>

    <!-- Pull Straps (Left & Right Ear Tabs) -->
    <path d="M 104,46 C 98,54 98,64 104,70" stroke-width="1.8"/>
    <path d="M 164,46 C 170,54 170,64 164,70" stroke-width="1.8"/>

    <!-- Boot Shaft & Foot Outline -->
    <!-- Shaft Left Line to Ankle & Instep -->
    <path d="M 106,42
             L 114,142
             C 114,154 106,164 96,170
             L 76,180
             C 68,184 66,194 78,195
             L 156,195
             C 168,195 174,178 174,158
             L 162,42 Z"
          stroke-width="2.8" fill="rgba(247, 240, 227, 0.06)"/>

    <!-- Cuban Angled Riding Heel -->
    <path d="M 154,195
             L 150,218
             L 130,218
             L 135,195 Z"
          stroke-width="2.4" fill="rgba(247, 240, 227, 0.1)"/>
    <line x1="133" y1="206" x2="152" y2="206" stroke-width="1.2" opacity="0.6"/>

    <!-- Outsole & Welt Stitch Line -->
    <path d="M 76,195 C 104,200 132,198 156,195" stroke-width="2.6"/>
    <path d="M 80,192 C 104,196 130,195 152,192" stroke-width="1" stroke-dasharray="1.5 2"/>

    <!-- Ankle Crease Stress Lines (Natural leather fit) -->
    <path d="M 112,152 C 122,158 132,158 142,150" stroke-width="1.3" opacity="0.65"/>
    <path d="M 116,160 C 126,164 136,163 146,156" stroke-width="1.2" opacity="0.55"/>

    <!-- ══════════════════════════════════════════════════════════
         INTRICATE WESTERN EMBROIDERY (Reference Style Swirls)
         ══════════════════════════════════════════════════════════ -->
    <!-- Center Teardrop & Starburst Medallion on Shaft -->
    <g transform="translate(134, 94)">
      <!-- Central Western Heart / Teardrop -->
      <path d="M 0,-14 C -6,-6 -6,4 0,10 C 6,4 6,-6 0,-14 Z" stroke-width="1.4" fill="rgba(212, 175, 55, 0.1)"/>
      <circle cx="0" cy="-2" r="1.6" fill="#fff8ea"/>

      <!-- Radiating Floral Feather Vines -->
      <path d="M -2,-8 C -14,-16 -18,-6 -14,2 C -10,8 -2,6 -2,-2" stroke-width="1.2"/>
      <path d="M 2,-8 C 14,-16 18,-6 14,2 C 10,8 2,6 2,-2" stroke-width="1.2"/>

      <!-- Lower Winged Filigree -->
      <path d="M -2,4 C -12,12 -14,22 -6,26 C 0,28 -1,16 -1,8" stroke-width="1.2"/>
      <path d="M 2,4 C 12,12 14,22 6,26 C 0,28 1,16 1,8" stroke-width="1.2"/>
    </g>

    <!-- Side Shaft Double-Stitched Piping Line -->
    <path d="M 134,54 L 134,70" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>
    <path d="M 134,124 L 134,142" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.75"/>

    <!-- Toe Bug Stitched Medallion (Vamp Detailing) -->
    <path d="M 94,178 C 106,172 120,172 130,178" stroke-width="1.4"/>
    <path d="M 102,184 C 110,180 118,180 124,184" stroke-width="1.2"/>
    <!-- Pointed Toe Accent -->
    <path d="M 78,188 C 84,184 90,184 94,187" stroke-width="1.2" opacity="0.6"/>

    <!-- Sparkle Stars Surrounding Boots (✦) -->
    <g transform="translate(196, 76) scale(0.9)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <g transform="translate(48, 114) scale(0.7)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <circle cx="186" cy="116" r="1.3" fill="#e9d5aa"/>
    <circle cx="204" cy="52" r="1.1" fill="#e9d5aa"/>
    <circle cx="38" cy="138" r="1.2" fill="#e9d5aa"/>
  </g>
</svg>
