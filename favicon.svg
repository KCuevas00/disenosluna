  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#goldTrim)" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Monogram DL -->
