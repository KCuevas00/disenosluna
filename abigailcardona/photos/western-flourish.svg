<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Liquid Gold & Champagne Gradient -->
    <linearGradient id="westFlourishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="25%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>

    <!-- Warm Amber Glow Filter -->
    <filter id="flourishGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#4a3720" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g stroke="url(#westFlourishGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#flourishGlow)">

    <!-- ══════════════════════════════════════════════════════════
         LEFT ORNAMENTAL FILIGREE SCROLLS & WHEAT PLUMES
         ══════════════════════════════════════════════════════════ -->
    <!-- Primary Flowing Scroll Ribbons -->
    <path d="M 50,75 C 80,75 105,52 132,52 C 160,52 184,76 204,76 C 214,76 220,68 218,60 C 215,50 204,48 195,56 C 185,64 190,78 202,80 C 216,82 226,65 228,55" stroke-width="2.2"/>
    <path d="M 80,75 C 110,75 135,36 172,39 C 190,41 200,54 196,64" stroke-width="1.4" opacity="0.75"/>
    <path d="M 32,78 C 42,78 46,72 42,68 C 36,63 28,70 34,79 C 43,89 65,85 92,75" stroke-width="1.5"/>
    <path d="M 125,52 C 145,35 175,28 198,34" stroke-width="1.2" opacity="0.6"/>

    <!-- Left Delicate Wheat Grain Plumes -->
    <ellipse cx="140" cy="40" rx="4" ry="2" transform="rotate(-30 140 40)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="154" cy="36" rx="4" ry="2" transform="rotate(-25 154 36)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="168" cy="34" rx="4.5" ry="2" transform="rotate(-20 168 34)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="182" cy="33" rx="4.5" ry="2" transform="rotate(-15 182 33)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>

    <!-- Left Floating Stars & Beads -->
    <circle cx="110" cy="75" r="1.6" fill="#fffbf0"/>
    <circle cx="165" cy="56" r="1.4" fill="#e9d5aa"/>
    <g transform="translate(70, 60) scale(0.65)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>

    <!-- ══════════════════════════════════════════════════════════
         RIGHT ORNAMENTAL FILIGREE SCROLLS & WHEAT PLUMES
         ══════════════════════════════════════════════════════════ -->
    <!-- Primary Flowing Scroll Ribbons -->
    <path d="M 450,75 C 420,75 395,52 368,52 C 340,52 316,76 296,76 C 286,76 280,68 282,60 C 285,50 296,48 305,56 C 315,64 310,78 298,80 C 284,82 274,65 272,55" stroke-width="2.2"/>
    <path d="M 420,75 C 390,75 365,36 328,39 C 310,41 300,54 304,64" stroke-width="1.4" opacity="0.75"/>
    <path d="M 468,78 C 458,78 454,72 458,68 C 464,63 472,70 466,79 C 457,89 435,85 408,75" stroke-width="1.5"/>
    <path d="M 375,52 C 355,35 325,28 302,34" stroke-width="1.2" opacity="0.6"/>

    <!-- Right Delicate Wheat Grain Plumes -->
    <ellipse cx="360" cy="40" rx="4" ry="2" transform="rotate(30 360 40)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="346" cy="36" rx="4" ry="2" transform="rotate(25 346 36)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="332" cy="34" rx="4.5" ry="2" transform="rotate(20 332 34)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>
    <ellipse cx="318" cy="33" rx="4.5" ry="2" transform="rotate(15 318 33)" fill="rgba(212, 175, 55, 0.25)" stroke-width="0.9"/>

    <!-- Right Floating Stars & Beads -->
    <circle cx="390" cy="75" r="1.6" fill="#fffbf0"/>
    <circle cx="335" cy="56" r="1.4" fill="#e9d5aa"/>
    <g transform="translate(430, 60) scale(0.65)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>

    <!-- ══════════════════════════════════════════════════════════
         CENTER CREST: CHIC COWGIRL HAT WITH STARBURST
         ══════════════════════════════════════════════════════════ -->
    <g transform="translate(250, 66)">
      <!-- Hat Crown -->
      <path d="M -18,-2
               C -20,-15 -18,-26 -11,-32
               C -6,-36 0,-34 3,-30
               C 6,-34 12,-36 17,-32
               C 24,-26 26,-15 24,-2 Z"
            fill="rgba(247, 240, 227, 0.18)" stroke="#d4af37" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Crease Line -->
      <path d="M 3,-30 L 3,-4" stroke="#c9a86a" stroke-width="1.4" stroke-dasharray="1 2.5"/>

      <!-- Hat Band with Little Heart -->
      <path d="M -20,-2 C -10,-5 10,-5 26,-2" stroke="#d4af37" stroke-width="2.6"/>
      <path d="M -18,2 C -10,-1 10,-1 24,2" stroke="#fffbf0" stroke-width="1.2"/>
      <circle cx="3" cy="-1" r="2.2" fill="#fffbf0" stroke="#d4af37" stroke-width="0.8"/>

      <!-- Wide Rolled Brim -->
      <path d="M -38,6
               C -28,-2 -10,-5 3,-4
               C 16,-5 34,-2 44,6
               C 36,15 18,18 3,18
               C -12,18 -30,15 -38,6 Z"
            fill="rgba(247, 240, 227, 0.22)" stroke="#d4af37" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M -32,7 C -14,13 3,14 20,14 C 28,14 34,10 38,7" stroke="#fffbf0" stroke-width="1" opacity="0.85"/>

      <!-- Grand Celestial Starburst Above Center Hat Crest -->
      <g transform="translate(3, -48)">
        <!-- 8-point Radiating Starburst -->
        <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="1.2"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#fffbf0" stroke-width="1" opacity="0.75"/>
        <line x1="7" y1="-7" x2="-7" y2="7" stroke="#fffbf0" stroke-width="1" opacity="0.75"/>
        <circle cx="0" cy="0" r="2.4" fill="#fffbf0"/>
      </g>
    </g>

  </g>
</svg>
