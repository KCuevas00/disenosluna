<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shoeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="35%" stop-color="#e9d5aa"/>
      <stop offset="70%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>
    <filter id="shoeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a3720" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g stroke="url(#shoeGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#shoeShadow)">
    <!-- Horseshoe Outer Arc -->
    <path d="M 52,48
             C 46,74 44,116 66,146
             C 80,166 120,166 134,146
             C 156,116 154,74 148,48
             L 126,52
             C 130,76 130,110 118,128
             C 110,140 90,140 82,128
             C 70,110 70,76 74,52 Z"
          stroke-width="2.6" fill="rgba(247, 240, 227, 0.06)"/>

    <!-- Calcs / Heel Cleats at Tops -->
    <rect x="48" y="44" width="8" height="6" rx="1.5" fill="#d4af37" stroke-width="1"/>
    <rect x="144" y="44" width="8" height="6" rx="1.5" fill="#d4af37" stroke-width="1"/>

    <!-- Fullering Groove (Inset Line) -->
    <path d="M 58,62 C 54,90 56,122 74,144 C 84,156 116,156 126,144 C 144,122 146,90 142,62"
          stroke-width="1" stroke-dasharray="0.5 4" opacity="0.75"/>

    <!-- Nail Holes (7 Traditional Lucky Nail Holes) -->
    <g fill="#4a3720">
      <rect x="58" y="74" width="3.5" height="4.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="58" y="98" width="3.5" height="4.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="62" y="122" width="4.5" height="3.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="98" y="148" width="4" height="3.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="134" y="122" width="4.5" height="3.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="138" y="98" width="3.5" height="4.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
      <rect x="138" y="74" width="3.5" height="4.5" rx="1" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>

    <!-- Delicate Wheat Stalk Sprig Weaving Behind Left Side -->
    <path d="M 36,134 C 44,104 52,80 62,64" stroke-width="1.2" opacity="0.7"/>
    <!-- Wheat grains -->
    <ellipse cx="44" cy="112" rx="4" ry="2" transform="rotate(-35 44 112)" fill="rgba(212, 175, 55, 0.2)" stroke-width="0.9"/>
    <ellipse cx="48" cy="98" rx="4" ry="2" transform="rotate(-30 48 98)" fill="rgba(212, 175, 55, 0.2)" stroke-width="0.9"/>
    <ellipse cx="54" cy="84" rx="4" ry="2" transform="rotate(-25 54 84)" fill="rgba(212, 175, 55, 0.2)" stroke-width="0.9"/>

    <!-- Sparkle Stars (✦) -->
    <g transform="translate(100, 94) scale(0.9)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>
    <g transform="translate(162, 38) scale(0.65)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fffbf0" stroke-width="0.8"/>
    </g>
    <circle cx="100" cy="74" r="1.3" fill="#e9d5aa"/>
    <circle cx="100" cy="114" r="1.2" fill="#e9d5aa"/>
  </g>
</svg>
