<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cactusGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="35%" stop-color="#e9d5aa"/>
      <stop offset="70%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>
    <filter id="cactShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a3720" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g stroke="url(#cactusGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#cactShadow)">
    <!-- Main Center Stem Body -->
    <path d="M 68,236
             L 68,46
             C 68,30 92,30 92,46
             L 92,236 Z"
          stroke-width="2.6" fill="rgba(247, 240, 227, 0.06)"/>

    <!-- Left Arm -->
    <path d="M 68,148
             C 46,148 38,138 38,114
             L 38,82
             C 38,72 54,72 54,82
             L 54,110
             C 54,124 58,132 68,134"
          stroke-width="2.4" fill="rgba(247, 240, 227, 0.06)"/>

    <!-- Right Arm (Slightly Higher) -->
    <path d="M 92,126
             C 112,126 122,118 122,96
             L 122,66
             C 122,56 106,56 106,66
             L 106,94
             C 106,108 100,114 92,116"
          stroke-width="2.4" fill="rgba(247, 240, 227, 0.06)"/>

    <!-- Vertical Rib Lines - Center Trunk -->
    <path d="M 74,48 L 74,236" stroke-width="1.2" opacity="0.6"/>
    <path d="M 80,38 L 80,236" stroke-width="1.4" opacity="0.75"/>
    <path d="M 86,48 L 86,236" stroke-width="1.2" opacity="0.6"/>

    <!-- Vertical Rib Lines - Left Arm -->
    <path d="M 46,78 L 46,118 C 46,128 50,136 68,140" stroke-width="1" opacity="0.6"/>

    <!-- Vertical Rib Lines - Right Arm -->
    <path d="M 114,64 L 114,98 C 114,106 108,116 92,120" stroke-width="1" opacity="0.6"/>

    <!-- Fine-Line Horizontal Etch Shading (Reference style) -->
    <!-- Left side trunk hatchings -->
    <line x1="68" y1="65" x2="75" y2="65" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="80" x2="76" y2="80" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="95" x2="74" y2="95" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="170" x2="76" y2="170" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="185" x2="75" y2="185" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="200" x2="78" y2="200" stroke-width="1" opacity="0.5"/>
    <line x1="68" y1="215" x2="77" y2="215" stroke-width="1" opacity="0.5"/>

    <!-- Right side trunk hatchings -->
    <line x1="85" y1="72" x2="92" y2="72" stroke-width="1" opacity="0.5"/>
    <line x1="84" y1="140" x2="92" y2="140" stroke-width="1" opacity="0.5"/>
    <line x1="85" y1="155" x2="92" y2="155" stroke-width="1" opacity="0.5"/>
    <line x1="84" y1="175" x2="92" y2="175" stroke-width="1" opacity="0.5"/>
    <line x1="84" y1="192" x2="92" y2="192" stroke-width="1" opacity="0.5"/>
    <line x1="83" y1="210" x2="92" y2="210" stroke-width="1" opacity="0.5"/>

    <!-- Desert Ground Dune Mound -->
    <path d="M 40,238 C 60,234 100,234 124,238" stroke-width="2"/>
    <path d="M 52,243 C 70,240 92,240 110,243" stroke-width="1.3" opacity="0.6"/>

    <!-- Little Desert Flowers on Top of Cactus Stem -->
    <g transform="translate(80, 28) scale(0.7)">
      <circle cx="0" cy="0" r="2.5" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
      <path d="M 0,-6 L 0,6 M -6,0 L 6,0" stroke-width="1.1"/>
    </g>

    <!-- Celestial Twinkle Stars (✦) -->
    <g transform="translate(138, 44) scale(0.85)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <g transform="translate(24, 156) scale(0.6)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <circle cx="145" cy="80" r="1.2" fill="#e9d5aa"/>
    <circle cx="20" cy="180" r="1.1" fill="#e9d5aa"/>
  </g>
</svg>
