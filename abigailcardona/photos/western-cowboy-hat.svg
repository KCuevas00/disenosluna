<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="hatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="40%" stop-color="#e9d5aa"/>
      <stop offset="75%" stop-color="#c9a86a"/>
      <stop offset="100%" stop-color="#8a682f"/>
    </linearGradient>
    <filter id="hatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4a3720" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g stroke="url(#hatGold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#hatShadow)">
    <!-- Crown Main Shape -->
    <!-- Cattleman Crease Crown -->
    <path d="M 82,106
             C 80,82 82,60 92,48
             C 98,40 106,38 114,46
             C 118,50 120,52 122,50
             C 124,48 126,44 132,40
             C 142,34 150,38 156,46
             C 166,60 166,82 164,106 Z"
          stroke-width="2.6" fill="rgba(247, 240, 227, 0.08)"/>

    <!-- Center Crease Indent & Shading Lines -->
    <path d="M 122,50 C 122,66 123,84 124,104" stroke-width="1.8" stroke-dasharray="0.5 3"/>
    <path d="M 104,54 C 104,70 106,86 108,102" stroke-width="1.2" opacity="0.6"/>
    <path d="M 142,50 C 140,68 138,86 138,102" stroke-width="1.2" opacity="0.6"/>

    <!-- Crown Front Dent Highlight / Contour -->
    <path d="M 96,62 C 108,68 116,66 120,56" stroke-width="1.3" opacity="0.75"/>
    <path d="M 148,58 C 138,65 130,64 126,54" stroke-width="1.3" opacity="0.75"/>

    <!-- Hat Band (Chic Ribbon Wrap) -->
    <path d="M 78,108 C 102,102 142,102 168,108" stroke-width="3" stroke="#d4af37"/>
    <path d="M 78,112 C 104,106 142,106 168,112" stroke-width="1.8"/>

    <!-- Sweet Heart Buckle Accent on the Band -->
    <g transform="translate(120, 107)">
      <path d="M 0,2
               C -3,-2 -6,-1 -6,2
               C -6,5 -1,7 0,9
               C 1,7 6,5 6,2
               C 6,-1 3,-2 0,2 Z"
            fill="#d4af37" stroke="#fff8ea" stroke-width="1"/>
    </g>

    <!-- Curled Western Wide Brim Outer Rim -->
    <path d="M 28,124
             C 38,110 62,104 88,108
             C 114,112 136,112 160,108
             C 186,104 206,110 216,124
             C 218,136 200,146 168,148
             C 136,150 108,150 76,148
             C 44,146 26,136 28,124 Z"
          stroke-width="2.8" fill="rgba(247, 240, 227, 0.05)"/>

    <!-- Rolled Brim Edge Highlight Line -->
    <path d="M 34,124 C 64,136 102,142 140,142 C 178,142 208,134 212,124" stroke-width="1.4" opacity="0.85"/>
    <!-- Brim Subtle Radiating Etching -->
    <path d="M 52,126 C 60,132 72,136 84,138" stroke-width="1" opacity="0.5"/>
    <path d="M 190,126 C 182,132 170,136 158,138" stroke-width="1" opacity="0.5"/>

    <!-- Subtle Twinkling Sparkle Stars (✦) -->
    <!-- Top-Right Sparkle -->
    <g transform="translate(182, 36) scale(0.9)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <!-- Left Small Sparkle -->
    <g transform="translate(48, 86) scale(0.65)">
      <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#d4af37" stroke="#fff8ea" stroke-width="0.8"/>
    </g>
    <!-- Floating tiny stars -->
    <circle cx="170" cy="24" r="1.3" fill="#e9d5aa"/>
    <circle cx="198" cy="54" r="1.1" fill="#e9d5aa"/>
    <circle cx="42" cy="74" r="1.2" fill="#e9d5aa"/>
  </g>
</svg>
