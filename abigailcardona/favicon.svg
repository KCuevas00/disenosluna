<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="warmIvoryFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdfbf7" />
    </linearGradient>
    <linearGradient id="warmIvoryPocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f7efe2" />
    </linearGradient>
    <radialGradient id="sealRoyalBlueGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#15438c" />
      <stop offset="85%" stop-color="#0d2b5c" />
      <stop offset="100%" stop-color="#040d1b" />
    </radialGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ea" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c6f23" />
    </linearGradient>
    <filter id="sealShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0a1931" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#0a1931" opacity="0.14" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#fcfaf6" stroke="url(#goldTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#f8f4ec" opacity="0.9" />
  <polygon points="59,15 59,53 36,34" fill="#f1e7d6" opacity="0.9" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#warmIvoryPocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#goldTrim)" stroke-width="0.7" opacity="0.85" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#warmIvoryFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#goldTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Western Wheat & Champagne Corner Accents -->
  <circle cx="53" cy="11" r="3" fill="#15438c" opacity="0.9" />
  <circle cx="56" cy="13" r="2.4" fill="#d4af37" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#fbf0d8" />
  <circle cx="57" cy="9" r="1.5" fill="#ffffff" />
  <circle cx="11" cy="53" r="3" fill="#15438c" opacity="0.9" />
  <circle cx="8" cy="51" r="2.4" fill="#d4af37" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#c9a86a" />

  <!-- Wax Seal Stamp with 'A' monogram -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="11" fill="url(#sealRoyalBlueGold)" stroke="url(#goldTrim)" stroke-width="0.8" />
    <circle cx="32" cy="38" r="9" fill="none" stroke="#fff8ea" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Playfair Display', Georgia, serif" font-size="8.8" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">A</text>
  </g>
</svg>
