<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="25%" stop-color="#f5e4bd"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="75%" stop-color="#dfb86c"/>
      <stop offset="100%" stop-color="#8c6827"/>
    </linearGradient>
  </defs>

  <g stroke="url(#gradGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Ornamental Flourish Scroll -->
    <path d="M 60,75 C 90,75 115,55 140,55 C 170,55 195,78 215,78 C 225,78 232,70 230,62 C 227,52 215,50 205,58 C 195,66 200,80 212,82 C 228,84 240,65 242,55" stroke-width="2.2"/>
    <path d="M 90,75 C 120,75 145,35 185,38 C 205,40 215,55 210,65" stroke-width="1.4" opacity="0.75"/>
    <path d="M 40,78 C 50,78 55,72 50,68 C 44,63 35,70 42,80 C 52,90 75,85 105,75" stroke-width="1.5"/>

    <!-- Left Laurel Leaves -->
    <path d="M 195,65 Q 185,58 190,52 Q 198,58 195,65 Z" fill="url(#gradGold)" stroke-width="0.8"/>
    <path d="M 205,55 Q 198,46 204,40 Q 211,48 205,55 Z" fill="url(#gradGold)" stroke-width="0.8"/>
    <path d="M 218,48 Q 214,38 221,34 Q 226,42 218,48 Z" fill="url(#gradGold)" stroke-width="0.8"/>

    <!-- Right Ornamental Flourish Scroll (Mirror) -->
    <path d="M 440,75 C 410,75 385,55 360,55 C 330,55 305,78 285,78 C 275,78 268,70 270,62 C 273,52 285,50 295,58 C 305,66 300,80 288,82 C 272,84 260,65 258,55" stroke-width="2.2"/>
    <path d="M 410,75 C 380,75 355,35 315,38 C 295,40 285,55 290,65" stroke-width="1.4" opacity="0.75"/>
    <path d="M 460,78 C 450,78 445,72 450,68 C 456,63 465,70 458,80 C 448,90 425,85 395,75" stroke-width="1.5"/>

    <!-- Right Laurel Leaves -->
    <path d="M 305,65 Q 315,58 310,52 Q 302,58 305,65 Z" fill="url(#gradGold)" stroke-width="0.8"/>
    <path d="M 295,55 Q 302,46 296,40 Q 289,48 295,55 Z" fill="url(#gradGold)" stroke-width="0.8"/>
    <path d="M 282,48 Q 286,38 279,34 Q 274,42 282,48 Z" fill="url(#gradGold)" stroke-width="0.8"/>

    <!-- Center Graduation Mortarboard Cap & Tassel -->
    <!-- Cap Diamond Top -->
    <polygon points="250,32 286,48 250,64 214,48" fill="none" stroke="url(#gradGold)" stroke-width="2.6" />
    <polygon points="250,38 276,50 250,60 224,50" fill="url(#gradGold)" opacity="0.2" />

    <!-- Skull Cap Underneath -->
    <path d="M 228,55 L 228,68 Q 250,82 272,68 L 272,55" stroke-width="2.2" fill="none" />

    <!-- Center Button -->
    <circle cx="250" cy="48" r="2.8" fill="url(#gradGold)" stroke="none"/>

    <!-- Tassel Swag & Fringe -->
    <path d="M 250,48 Q 282,54 286,68" stroke-width="1.8" fill="none"/>
    <path d="M 286,68 L 283,86 L 289,86 Z" fill="url(#gradGold)" stroke-width="1"/>

    <!-- Base Laurel Ribbon Arc -->
    <path d="M 218,87 Q 250,94 282,87" stroke-width="2"/>
    <circle cx="250" cy="91" r="2" fill="url(#gradGold)"/>
  </g>
</svg>
