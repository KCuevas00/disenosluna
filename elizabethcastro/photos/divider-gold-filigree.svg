<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 44" width="100%" height="100%">
  <defs>
    <linearGradient id="filigreeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9aa4b2" stop-opacity="0"/>
      <stop offset="20%" stop-color="#c5cdd8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#c5cdd8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9aa4b2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rubyCenter" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb2c9"/>
      <stop offset="60%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#882245"/>
    </radialGradient>
    <filter id="filigreeShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4a2030" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#filigreeShadow)">
    <!-- Main Tapered Divider Lines -->
    <line x1="25" y1="22" x2="205" y2="22" stroke="url(#filigreeGold)" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="295" y1="22" x2="475" y2="22" stroke="url(#filigreeGold)" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Left Scrollwork Flourishes -->
    <path d="M 170 22 C 185 22, 195 12, 210 16 C 220 19, 225 28, 235 22 C 228 17, 218 20, 212 22" 
          fill="none" stroke="#b8c2cf" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 190 22 C 198 27, 210 32, 222 28 C 228 25, 233 22, 238 22" 
          fill="none" stroke="#9aa4b2" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="172" cy="22" r="1.6" fill="#c5cdd8"/>
    <circle cx="210" cy="16" r="2" fill="#c5cdd8"/>

    <!-- Right Scrollwork Flourishes (Mirrored) -->
    <path d="M 330 22 C 315 22, 305 12, 290 16 C 280 19, 275 28, 265 22 C 272 17, 282 20, 288 22" 
          fill="none" stroke="#b8c2cf" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 310 22 C 302 27, 290 32, 278 28 C 272 25, 267 22, 262 22" 
          fill="none" stroke="#9aa4b2" stroke-width="1.1" stroke-linecap="round"/>
    <circle cx="328" cy="22" r="1.6" fill="#c5cdd8"/>
    <circle cx="290" cy="16" r="2" fill="#c5cdd8"/>

    <!-- Center Medallion: Baroque Ruby & Silver Jewel -->
    <!-- Silver Petals / Rays -->
    <path d="M 250 11 L 253 18 L 261 22 L 253 26 L 250 33 L 247 26 L 239 22 L 247 18 Z" fill="#b8c2cf"/>
    <path d="M 250 13 L 252 19 L 259 22 L 252 25 L 250 31 L 248 25 L 241 22 L 248 19 Z" fill="#f0f4f8"/>
    
    <!-- Rose Quartz Cabochon Center -->
    <circle cx="250" cy="22" r="4.8" fill="url(#rubyCenter)" stroke="#9aa4b2" stroke-width="0.8"/>
    <circle cx="248.5" cy="20.5" r="1.2" fill="#ffffff" fill-opacity="0.85"/>
  </g>
</svg>
