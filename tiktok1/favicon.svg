<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="purpleFlap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf5fc" />
    </linearGradient>
    <linearGradient id="purplePocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5fc" />
      <stop offset="100%" stop-color="#f0e2f5" />
    </linearGradient>
    <radialGradient id="sealPurpleGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3e3f9" />
      <stop offset="35%" stop-color="#c5a1d8" />
      <stop offset="75%" stop-color="#a074b4" />
      <stop offset="100%" stop-color="#4a235c" />
    </radialGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#c99b42" />
      <stop offset="100%" stop-color="#8c6320" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#4a235c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Envelope Drop Shadow -->
  <rect x="5" y="15" width="54" height="38" rx="4" fill="#000000" opacity="0.12" transform="translate(0, 2)" />

  <!-- Envelope Back Body -->
  <rect x="5" y="15" width="54" height="38" rx="3.5" fill="#fcf9fd" stroke="url(#goldTrim)" stroke-width="0.8" />

  <!-- Side Folds -->
  <polygon points="5,15 5,53 28,34" fill="#faf5fc" opacity="0.9" />
  <polygon points="59,15 59,53 36,34" fill="#f0e2f5" opacity="0.9" />

  <!-- Bottom Pocket Fold -->
  <polygon points="5,53 59,53 32,34" fill="url(#purplePocket)" />
  <path d="M5 53 L32 34 L59 53" fill="none" stroke="url(#goldTrim)" stroke-width="0.7" opacity="0.8" />

  <!-- Top Triangular Flap -->
  <polygon points="5,15 59,15 32,38" fill="url(#purpleFlap)" />
  <path d="M5 15 L32 38 L59 15" fill="none" stroke="url(#goldTrim)" stroke-width="0.9" opacity="0.9" />

  <!-- Mini Corner Floral Accents (Pastel Purple, White & Gold) -->
  <circle cx="53" cy="11" r="3.2" fill="#a074b4" opacity="0.95" />
  <circle cx="56" cy="13" r="2.6" fill="#c5a1d8" opacity="0.95" />
  <circle cx="51" cy="8" r="1.8" fill="#fef08a" />
  <circle cx="57" cy="9" r="1.6" fill="#ffffff" />
  <circle cx="11" cy="53" r="3.2" fill="#a074b4" opacity="0.95" />
  <circle cx="8" cy="51" r="2.6" fill="#c5a1d8" opacity="0.95" />
  <circle cx="13" cy="56" r="1.8" fill="#c99b42" />

  <!-- Pastel Purple Wax Seal Stamp -->
  <g filter="url(#sealShadow)">
    <circle cx="32" cy="38" r="10.5" fill="url(#sealPurpleGold)" stroke="url(#goldTrim)" stroke-width="0.75" />
    <circle cx="32" cy="38" r="8.8" fill="none" stroke="#fef08a" stroke-width="0.6" opacity="0.85" />
    <text x="32" y="38.5" font-family="'Alex Brush', 'Playfair Display', Georgia, serif" font-size="8.5" font-weight="bold" fill="#fef08a" text-anchor="middle" dominant-baseline="central">XV</text>
  </g>
</svg>
