<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="roseMain" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff3b56" />
      <stop offset="35%" stop-color="#c41e3a" />
      <stop offset="75%" stop-color="#7a0008" />
      <stop offset="100%" stop-color="#3d0004" />
    </radialGradient>
    <radialGradient id="roseSecondary" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e62e49" />
      <stop offset="50%" stop-color="#9e1124" />
      <stop offset="100%" stop-color="#4d0006" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8c3a" />
      <stop offset="60%" stop-color="#2d5c28" />
      <stop offset="100%" stop-color="#143012" />
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd978" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a37b16" />
    </linearGradient>
    <filter id="cornerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#360005" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cornerShadow)">
    <!-- Golden Baroque Corner Flourishes -->
    <path d="M 180 20 C 150 16, 120 34, 106 60 C 96 78, 102 96, 88 112"
          fill="none" stroke="url(#goldFiligree)" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 180 32 C 160 30, 142 42, 134 58 C 126 74, 130 86, 120 98"
          fill="none" stroke="url(#goldFiligree)" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="106" cy="60" r="3" fill="#d4af37" />
    <circle cx="88" cy="112" r="2.5" fill="#d4af37" />

    <!-- Lush Emerald Foliage -->
    <path d="M 130 50 C 110 30, 120 10, 150 20 C 160 38, 146 54, 130 50 Z"
          fill="url(#leafGrad)" stroke="#143012" stroke-width="1" />
    <path d="M 90 90 C 70 70, 80 50, 110 60 C 120 78, 106 94, 90 90 Z"
          fill="url(#leafGrad)" stroke="#143012" stroke-width="1" />
    <path d="M 150 110 C 140 134, 120 140, 114 116 C 124 100, 142 98, 150 110 Z"
          fill="url(#leafGrad)" stroke="#143012" stroke-width="1" />
    <path d="M 174 80 C 190 64, 196 84, 180 96 C 168 96, 166 88, 174 80 Z"
          fill="url(#leafGrad)" stroke="#143012" stroke-width="0.8" />

    <!-- Leaf Veins -->
    <path d="M 132 48 Q 138 32, 148 22" fill="none" stroke="#6ca858" stroke-width="1" />
    <path d="M 92 88 Q 98 72, 108 62" fill="none" stroke="#6ca858" stroke-width="1" />

    <!-- White Baby's Breath Accents (Charra Elegante Style) -->
    <circle cx="160" cy="40" r="2.8" fill="#ffffff" stroke="#c59b27" stroke-width="0.6" />
    <circle cx="170" cy="48" r="2.2" fill="#ffffff" stroke="#c59b27" stroke-width="0.6" />
    <circle cx="164" cy="56" r="2.5" fill="#ffffff" stroke="#c59b27" stroke-width="0.6" />
    <circle cx="84" cy="98" r="2.5" fill="#ffffff" stroke="#c59b27" stroke-width="0.6" />
    <circle cx="76" cy="106" r="2.2" fill="#ffffff" stroke="#c59b27" stroke-width="0.6" />

    <!-- Upper Secondary Crimson Rose -->
    <g transform="translate(144, 62)">
      <circle cx="0" cy="0" r="20" fill="url(#roseSecondary)" stroke="#4d0006" stroke-width="1" />
      <path d="M -12 -4 C -8 -16, 12 -16, 14 -4 C 12 12, -8 12, -12 -4 Z" fill="#b8142a" />
      <path d="M -6 -4 C -4 -10, 8 -10, 10 -4 C 8 6, -4 6, -6 -4 Z" fill="#7a0008" />
      <circle cx="2" cy="-4" r="3.5" fill="#ff4d67" />
    </g>

    <!-- Lower Secondary Crimson Rose -->
    <g transform="translate(108, 116)">
      <circle cx="0" cy="0" r="17" fill="url(#roseSecondary)" stroke="#4d0006" stroke-width="1" />
      <path d="M -10 -3 C -7 -13, 10 -13, 12 -3 C 10 10, -7 10, -10 -3 Z" fill="#b8142a" />
      <circle cx="1" cy="-3" r="3" fill="#ff4d67" />
    </g>

    <!-- Main Majestic Central Velvet Rose -->
    <g transform="translate(146, 108)">
      <circle cx="0" cy="0" r="30" fill="url(#roseMain)" stroke="#3d0004" stroke-width="1.4" />
      <path d="M -20 -6 C -14 -24, 18 -24, 22 -6 C 18 18, -14 18, -20 -6 Z" fill="#9e1124" />
      <path d="M -12 -5 C -8 -16, 12 -16, 14 -5 C 12 10, -8 10, -12 -5 Z" fill="#69000a" />
      <path d="M -6 -4 C -4 -10, 8 -10, 9 -4 C 8 5, -4 5, -6 -4 Z" fill="#c41e3a" />
      <circle cx="2" cy="-3" r="4.5" fill="#ff3b56" />
    </g>
  </g>
</svg>
