<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <linearGradient id="bootLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a4622" />
      <stop offset="45%" stop-color="#552e14" />
      <stop offset="85%" stop-color="#361a08" />
      <stop offset="100%" stop-color="#241004" />
    </linearGradient>
    <linearGradient id="bootHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9d5f30" />
      <stop offset="50%" stop-color="#6d3918" />
      <stop offset="100%" stop-color="#3b1d0a" />
    </linearGradient>
    <linearGradient id="goldStitch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe399" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a37b16" />
    </linearGradient>
    <radialGradient id="rosePedal" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e62e49" />
      <stop offset="65%" stop-color="#9e1124" />
      <stop offset="100%" stop-color="#59000a" />
    </radialGradient>
    <filter id="bootDropShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#241004" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#bootDropShadow)">
    <!-- Rear / Left Boot -->
    <g transform="translate(-14, -8) scale(0.92)">
      <!-- Heel & Sole -->
      <path d="M 64 128 L 60 142 L 78 142 L 78 128 Z" fill="#201006" />
      <path d="M 78 136 C 88 136, 114 137, 130 134 C 132 134, 135 130, 134 126 C 130 123, 118 121, 102 121 L 78 126 Z" fill="#201006" />

      <!-- Boot Upper Body -->
      <path d="M 66 52 C 72 58, 86 58, 92 52 L 95 106 C 96 112, 104 116, 122 121 C 134 124, 133 130, 128 133 C 112 136, 88 135, 78 134 L 64 134 C 61 127, 61 114, 63 103 Z"
            fill="#3d1d0a" stroke="#241004" stroke-width="1.5" />
    </g>

    <!-- Front / Right Boot -->
    <!-- Heel & Sole -->
    <path d="M 52 118 L 48 134 L 68 134 L 68 120 Z" fill="#1f0e05" stroke="#100702" stroke-width="1" />
    <path d="M 68 126 C 78 126, 106 127, 122 124 C 126 123, 128 119, 126 116 C 120 113, 106 111, 92 111 L 68 116 Z" fill="#1f0e05" stroke="#100702" stroke-width="1" />

    <!-- Boot Shaft & Foot (Warm rich saddle leather) -->
    <path d="M 54 36 C 60 42, 78 42, 84 36 L 86 92 C 88 98, 96 102, 114 107 C 126 110, 125 116, 120 119 C 104 122, 78 121, 68 120 L 52 120 C 49 113, 49 100, 51 89 Z"
          fill="url(#bootLeather)" stroke="#220e03" stroke-width="1.8" />

    <!-- Deep Leather Inset & Pull Tab -->
    <path d="M 54 36 C 58 41, 80 41, 84 36" fill="none" stroke="url(#goldStitch)" stroke-width="2.5" />
    <path d="M 83 40 L 85 54 L 81 54 L 79 40" fill="#9d5f30" stroke="#220e03" stroke-width="1" />

    <!-- Traditional Western Filigree Stitching Patterns -->
    <path d="M 60 48 Q 70 60, 62 76 Q 74 68, 78 84" fill="none" stroke="url(#goldStitch)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 78 48 Q 68 60, 76 76 Q 64 68, 60 84" fill="none" stroke="url(#goldStitch)" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 69 44 L 69 88" fill="none" stroke="url(#goldStitch)" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Toe Bug Embroidery Pattern -->
    <path d="M 90 102 Q 102 98, 112 108" fill="none" stroke="url(#goldStitch)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 94 106 Q 104 102, 112 110" fill="none" stroke="url(#goldStitch)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Decorative Red Rose nestled at base of boots -->
    <g transform="translate(34, 102) scale(0.68)">
      <!-- Green Leaves -->
      <path d="M 8 18 C -4 10, -2 0, 12 6 C 14 12, 12 16, 8 18 Z" fill="#2d5a27" stroke="#1b3817" stroke-width="1" />
      <path d="M 28 24 C 38 32, 44 24, 38 12 C 32 14, 28 18, 28 24 Z" fill="#2d5a27" stroke="#1b3817" stroke-width="1" />

      <!-- Rose Blossom Petals -->
      <circle cx="18" cy="14" r="14" fill="url(#rosePedal)" />
      <path d="M 8 12 C 10 4, 26 4, 28 12 C 26 22, 10 22, 8 12 Z" fill="#b8142a" />
      <path d="M 12 10 C 15 6, 21 6, 24 10 C 22 16, 14 16, 12 10 Z" fill="#80000a" />
      <circle cx="18" cy="11" r="3.5" fill="#e62e49" />
    </g>
  </g>
</svg>
