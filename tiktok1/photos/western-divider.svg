<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8022" stop-opacity="0" />
      <stop offset="20%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff1ba" />
      <stop offset="80%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8022" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="divRose" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f03852" />
      <stop offset="45%" stop-color="#c41e3a" />
      <stop offset="85%" stop-color="#7a0008" />
    </radialGradient>
    <filter id="divGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4a2810" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#divGlow)">
    <!-- Thin Tapered Center Lines -->
    <line x1="20" y1="25" x2="200" y2="25" stroke="url(#divGold)" stroke-width="1.6" stroke-linecap="round" />
    <line x1="300" y1="25" x2="480" y2="25" stroke="url(#divGold)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Left Ornate Charro Scrollwork -->
    <path d="M 140 25 C 160 25, 175 14, 195 18 C 210 21, 218 32, 230 25"
          fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 155 25 C 170 25, 182 34, 198 32 C 212 30, 220 22, 230 25"
          fill="none" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="178" cy="18" r="2.2" fill="#d4af37" />
    <circle cx="198" cy="32" r="2.2" fill="#d4af37" />

    <!-- Right Ornate Charro Scrollwork -->
    <path d="M 360 25 C 340 25, 325 14, 305 18 C 290 21, 282 32, 270 25"
          fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 345 25 C 330 25, 318 34, 302 32 C 288 30, 280 22, 270 25"
          fill="none" stroke="#d4af37" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="322" cy="18" r="2.2" fill="#d4af37" />
    <circle cx="302" cy="32" r="2.2" fill="#d4af37" />

    <!-- Centerpiece: Miniature Golden Horseshoe & Crimson Rose -->
    <!-- Golden Mini Horseshoe in Center -->
    <path d="M 241 15 C 241 10, 246 10, 247 15 L 247 24 C 247 31, 250 35, 253 35 C 256 35, 259 31, 259 24 L 259 15 C 260 10, 265 10, 265 15 L 265 24 C 265 35, 260 40, 253 40 C 246 40, 241 35, 241 24 Z"
          fill="#d4af37" stroke="#8a6715" stroke-width="1.2" />

    <!-- Center Crimson Rose Blossom -->
    <circle cx="250" cy="25" r="9" fill="url(#divRose)" stroke="#4a0005" stroke-width="0.8" />
    <path d="M 244 23 C 245 18, 255 18, 256 23 C 255 29, 245 29, 244 23 Z" fill="#9e1124" />
    <circle cx="250" cy="22" r="2.2" fill="#ff4d67" />

    <!-- Small Emerald Flanking Leaves -->
    <path d="M 239 25 C 235 22, 235 28, 239 25 Z" fill="#2d5c28" />
    <path d="M 261 25 C 265 22, 265 28, 261 25 Z" fill="#2d5c28" />
  </g>
</svg>
