<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="clusterRoseRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff3b56" />
      <stop offset="35%" stop-color="#c41e3a" />
      <stop offset="75%" stop-color="#7a0008" />
      <stop offset="100%" stop-color="#3d0004" />
    </radialGradient>
    <linearGradient id="clusterLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e8c3a" />
      <stop offset="60%" stop-color="#2d5c28" />
      <stop offset="100%" stop-color="#143012" />
    </linearGradient>
    <filter id="clusterShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#360005" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#clusterShadow)">
    <!-- Leaves -->
    <path d="M 24 38 C 10 24, 18 10, 38 18 C 44 30, 36 42, 24 38 Z" fill="url(#clusterLeaf)" stroke="#143012" stroke-width="0.8" />
    <path d="M 68 70 C 84 82, 92 70, 82 52 C 72 52, 66 60, 68 70 Z" fill="url(#clusterLeaf)" stroke="#143012" stroke-width="0.8" />
    <path d="M 72 28 C 88 18, 92 34, 78 46 C 70 42, 68 34, 72 28 Z" fill="url(#clusterLeaf)" stroke="#143012" stroke-width="0.8" />
    <path d="M 26 68 C 12 78, 8 62, 22 50 C 30 54, 32 62, 26 68 Z" fill="url(#clusterLeaf)" stroke="#143012" stroke-width="0.8" />

    <!-- Gold Accent Flourish -->
    <path d="M 30 20 Q 20 12, 14 24" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="14" cy="24" r="1.5" fill="#d4af37" />
    <path d="M 78 74 Q 88 82, 84 90" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="84" cy="90" r="1.5" fill="#d4af37" />

    <!-- Smaller Flanking Rose -->
    <g transform="translate(34, 42)">
      <circle cx="0" cy="0" r="13" fill="url(#clusterRoseRed)" stroke="#4d0006" stroke-width="0.8" />
      <path d="M -8 -3 C -5 -11, 7 -11, 9 -3 C 8 8, -5 8, -8 -3 Z" fill="#b8142a" />
      <circle cx="1" cy="-2" r="2.5" fill="#ff4d67" />
    </g>

    <!-- Main Rose Blossom -->
    <g transform="translate(56, 50)">
      <circle cx="0" cy="0" r="20" fill="url(#clusterRoseRed)" stroke="#3d0004" stroke-width="1" />
      <path d="M -14 -4 C -10 -16, 12 -16, 15 -4 C 12 12, -10 12, -14 -4 Z" fill="#9e1124" />
      <path d="M -8 -3 C -5 -11, 8 -11, 10 -3 C 8 7, -5 7, -8 -3 Z" fill="#69000a" />
      <circle cx="1" cy="-2" r="3.2" fill="#ff3b56" />
    </g>
  </g>
</svg>
