<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="westernGoldFlourish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1ba"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#5a420e"/>
    </linearGradient>
    <radialGradient id="flourishRose" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff3b56" />
      <stop offset="45%" stop-color="#c41e3a" />
      <stop offset="85%" stop-color="#7a0008" />
    </radialGradient>
  </defs>

  <g stroke="url(#westernGoldFlourish)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Filigree Scrollwork -->
    <path d="M 60,75 C 90,75 115,55 140,55 C 170,55 195,78 215,78 C 225,78 232,70 230,62 C 227,52 215,50 205,58 C 195,66 200,80 212,82 C 228,84 240,65 242,55" stroke-width="2.2"/>
    <path d="M 90,75 C 120,75 145,35 185,38 C 205,40 215,55 210,65" stroke-width="1.4" opacity="0.85"/>
    <path d="M 40,78 C 50,78 55,72 50,68 C 44,63 35,70 42,80 C 52,90 75,85 105,75" stroke-width="1.5"/>

    <!-- Right Filigree Scrollwork (Mirror) -->
    <path d="M 440,75 C 410,75 385,55 360,55 C 330,55 305,78 285,78 C 275,78 268,70 270,62 C 273,52 285,50 295,58 C 305,66 300,80 288,82 C 272,84 260,65 258,55" stroke-width="2.2"/>
    <path d="M 410,75 C 380,75 355,35 315,38 C 295,40 285,55 290,65" stroke-width="1.4" opacity="0.85"/>
    <path d="M 460,78 C 450,78 445,72 450,68 C 456,63 465,70 458,80 C 448,90 425,85 395,75" stroke-width="1.5"/>

    <!-- Centerpiece Golden Horseshoe -->
    <path d="M 232,45 C 232,32 240,32 242,45 L 242,66 C 242,78 246,82 250,82 C 254,82 258,78 258,66 L 258,45 C 260,32 268,32 268,45 L 268,66 C 268,84 259,92 250,92 C 241,92 232,84 232,66 Z"
          fill="url(#westernGoldFlourish)" stroke="#805b10" stroke-width="1.5"/>

    <!-- Nail Accents -->
    <circle cx="236" cy="50" r="1.5" fill="#3a2505"/>
    <circle cx="236" cy="62" r="1.5" fill="#3a2505"/>
    <circle cx="264" cy="50" r="1.5" fill="#3a2505"/>
    <circle cx="264" cy="62" r="1.5" fill="#3a2505"/>

    <!-- Central Crimson Rose at Horseshoe Base -->
    <circle cx="250" cy="80" r="9" fill="url(#flourishRose)" stroke="#4a0005" stroke-width="0.8"/>
    <circle cx="250" cy="78" r="3.2" fill="#ff4d67"/>
  </g>
