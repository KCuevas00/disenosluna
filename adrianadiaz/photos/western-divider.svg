<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8022" stop-opacity="0" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff1ba" />
      <stop offset="75%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8022" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="divRedBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e02838" />
      <stop offset="45%" stop-color="#b01624" />
      <stop offset="85%" stop-color="#6e0a13" />
    </linearGradient>
    <filter id="divShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#400408" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#divShadow)">
    <!-- Thin Tapered Center Lines -->
    <line x1="20" y1="25" x2="215" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round" />
    <line x1="285" y1="25" x2="480" y2="25" stroke="url(#divGold)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Left Delicate Ribbon Curves -->
    <path d="M 175 25 C 190 25, 202 18, 215 22 C 224 25, 228 30, 235 25"
          fill="none" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="195" cy="20" r="1.6" fill="#d4af37" />

    <!-- Right Delicate Ribbon Curves -->
    <path d="M 325 25 C 310 25, 298 18, 285 22 C 276 25, 272 30, 265 25"
          fill="none" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="305" cy="20" r="1.6" fill="#d4af37" />

    <!-- Centerpiece: Miniature Red Ribbon Bow -->
    <!-- Left Loop -->
    <path d="M 248 24 C 241 14, 228 12, 222 18 C 217 23, 221 32, 232 32 C 240 32, 246 27, 248 25 Z"
          fill="url(#divRedBow)" stroke="#5c060d" stroke-width="0.7" />
    <!-- Right Loop -->
    <path d="M 252 24 C 259 14, 272 12, 278 18 C 283 23, 279 32, 268 32 C 260 32, 254 27, 252 25 Z"
          fill="url(#divRedBow)" stroke="#5c060d" stroke-width="0.7" />

    <!-- Left Ribbon Tail -->
    <path d="M 247 27 C 243 33, 237 40, 232 44 C 236 43, 240 42, 244 43 C 247 38, 249 33, 249 28 Z"
          fill="url(#divRedBow)" />
    <!-- Right Ribbon Tail -->
    <path d="M 253 27 C 257 33, 263 40, 268 44 C 264 43, 260 42, 256 43 C 253 38, 251 33, 251 28 Z"
          fill="url(#divRedBow)" />

    <!-- Center Knot -->
    <ellipse cx="250" cy="25" rx="4.8" ry="5.2" fill="#d92534" stroke="#4d050c" stroke-width="0.8" />
    <circle cx="249" cy="24" r="1.2" fill="#ff7a8a" />
  </g>
</svg>
