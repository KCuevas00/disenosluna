<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cactusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46733b" />
      <stop offset="50%" stop-color="#2d5225" />
      <stop offset="100%" stop-color="#193314" />
    </linearGradient>
    <linearGradient id="cactusRibs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70a362" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#142910" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="cactusBloom" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f2465e" />
      <stop offset="50%" stop-color="#c41e3a" />
      <stop offset="100%" stop-color="#69000a" />
    </radialGradient>
    <filter id="cactusShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#142910" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#cactusShadow)">
    <!-- Main Center Stem -->
    <path d="M 50 148 L 50 32 C 50 18, 70 18, 70 32 L 70 148 Z"
          fill="url(#cactusGrad)" stroke="#162e12" stroke-width="2" />

    <!-- Center Stem Rib Lines -->
    <path d="M 56 30 L 56 148" fill="none" stroke="url(#cactusRibs)" stroke-width="1.8" />
    <path d="M 64 30 L 64 148" fill="none" stroke="url(#cactusRibs)" stroke-width="1.8" />

    <!-- Left Arm -->
    <path d="M 50 96 C 32 96, 24 88, 24 64 L 24 50 C 24 40, 38 40, 38 50 L 38 68 C 38 78, 42 82, 50 82 Z"
          fill="url(#cactusGrad)" stroke="#162e12" stroke-width="1.8" />
    <path d="M 31 48 L 31 66 C 31 76, 38 88, 50 88" fill="none" stroke="url(#cactusRibs)" stroke-width="1.5" />

    <!-- Right Arm -->
    <path d="M 70 82 C 78 82, 82 78, 82 68 L 82 40 C 82 30, 96 30, 96 40 L 96 64 C 96 88, 88 96, 70 96 Z"
          fill="url(#cactusGrad)" stroke="#162e12" stroke-width="1.8" />
    <path d="M 89 38 L 89 66 C 89 76, 82 88, 70 88" fill="none" stroke="url(#cactusRibs)" stroke-width="1.5" />

    <!-- Gold Desert Spine Accents -->
    <circle cx="50" cy="52" r="1.5" fill="#d4af37" />
    <circle cx="70" cy="52" r="1.5" fill="#d4af37" />
    <circle cx="50" cy="74" r="1.5" fill="#d4af37" />
    <circle cx="70" cy="74" r="1.5" fill="#d4af37" />
    <circle cx="24" cy="56" r="1.3" fill="#d4af37" />
    <circle cx="38" cy="56" r="1.3" fill="#d4af37" />
    <circle cx="82" cy="48" r="1.3" fill="#d4af37" />
    <circle cx="96" cy="48" r="1.3" fill="#d4af37" />

    <!-- Top Crimson Desert Bloom -->
    <g transform="translate(60, 20)">
      <circle cx="0" cy="0" r="8" fill="url(#cactusBloom)" stroke="#520007" stroke-width="0.8" />
      <circle cx="0" cy="0" r="4" fill="#f03852" />
      <circle cx="0" cy="0" r="1.8" fill="#ffd700" />
    </g>

    <!-- Right Arm Desert Bloom -->
    <g transform="translate(89, 32)">
      <circle cx="0" cy="0" r="6" fill="url(#cactusBloom)" stroke="#520007" stroke-width="0.7" />
      <circle cx="0" cy="0" r="3" fill="#f03852" />
      <circle cx="0" cy="0" r="1.3" fill="#ffd700" />
    </g>
  </g>
</svg>
