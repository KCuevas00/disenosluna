<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#f5e19e"/>
    </linearGradient>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d92534"/>
      <stop offset="50%" stop-color="#a31d24"/>
      <stop offset="100%" stop-color="#6e0a13"/>
    </linearGradient>
    <filter id="shadowEnv" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a1c0d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadowEnv)">
    <!-- Envelope Body -->
    <rect x="18" y="26" width="44" height="32" rx="4" fill="#ffffff" stroke="url(#goldGradEnv)" stroke-width="2"/>
    
    <!-- Envelope Folds -->
    <path d="M 19 28 L 40 44 L 61 28" fill="none" stroke="url(#goldGradEnv)" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 19 57 L 33 42" fill="none" stroke="url(#goldGradEnv)" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 61 57 L 47 42" fill="none" stroke="url(#goldGradEnv)" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Subtle Gold Ribbon Cross -->
    <line x1="18" y1="42" x2="62" y2="42" stroke="url(#goldGradEnv)" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Wax Seal Centered over Flap Point -->
    <circle cx="40" cy="44" r="9" fill="url(#sealGrad)" stroke="#52050b" stroke-width="0.8"/>
    <circle cx="40" cy="44" r="7.2" fill="none" stroke="#e04856" stroke-width="0.7" stroke-dasharray="1 1.2"/>
    <!-- Heart Monogram inside Seal -->
    <path d="M 40 42 C 41 40.5, 43 40.5, 44 41.5 C 45 42.5, 44 44, 40 47 C 36 44, 35 42.5, 36 41.5 C 37 40.5, 39 40.5, 40 42 Z" fill="#ffd782"/>

    <!-- Top Heart Sparkle Floating Out of Envelope -->
    <path d="M 40 18 C 42 15.5, 45 15.5, 46.5 17.5 C 48 19.5, 46.5 22, 40 26 C 33.5 22, 32 19.5, 33.5 17.5 C 35 15.5, 38 15.5, 40 18 Z" 
          fill="#a31d24" stroke="url(#goldGradEnv)" stroke-width="1"/>
    
    <circle cx="25" cy="20" r="1.4" fill="#d4af37"/>
    <circle cx="55" cy="21" r="1.6" fill="#d4af37"/>
  </g>
</svg>
