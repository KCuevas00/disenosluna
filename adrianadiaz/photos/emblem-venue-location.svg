<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradVenue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="75%" stop-color="#aa8022"/>
      <stop offset="100%" stop-color="#f5e19e"/>
    </linearGradient>
    <filter id="shadowVenue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3a1c0d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#shadowVenue)">
    <!-- Ornate Outer Sunburst Star -->
    <path d="M 40 10 L 43 25 L 58 28 L 45 37 L 49 52 L 40 43 L 31 52 L 35 37 L 22 28 L 37 25 Z" 
          fill="none" stroke="url(#goldGradVenue)" stroke-width="1.2"/>
    
    <!-- Outer Filigree Ring -->
    <circle cx="40" cy="40" r="26" fill="#fffdfa" stroke="url(#goldGradVenue)" stroke-width="1.8"/>
    <circle cx="40" cy="40" r="22" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="1.5 2"/>

    <!-- Map Destination Pin Stylized in Gold -->
    <path d="M 40 24 C 33 24, 28 29.5, 28 36.5 C 28 45.5, 40 56, 40 56 C 40 56, 52 45.5, 52 36.5 C 52 29.5, 47 24, 40 24 Z" 
          fill="url(#goldGradVenue)" stroke="#aa8022" stroke-width="1"/>
    
    <!-- Ruby Core with Heart / Star inside Pin -->
    <circle cx="40" cy="35" r="5.5" fill="#a31d24"/>
    <circle cx="40" cy="35" r="4" fill="none" stroke="#fff" stroke-width="0.6"/>
    <circle cx="38.5" cy="33.5" r="1.1" fill="#fff"/>

    <!-- Mini Laurel Leaves on Base -->
    <path d="M 24 58 C 32 55, 48 55, 56 58" fill="none" stroke="url(#goldGradVenue)" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="40" cy="62" r="1.6" fill="#a31d24"/>
  </g>
</svg>
