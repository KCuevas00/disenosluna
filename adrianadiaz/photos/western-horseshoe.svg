<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHorseshoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1ba" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa8022" />
      <stop offset="100%" stop-color="#5a420e" />
    </linearGradient>
    <linearGradient id="goldInnerRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd978" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#ffd978" />
    </linearGradient>
    <radialGradient id="roseRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f03852" />
      <stop offset="40%" stop-color="#c41e3a" />
      <stop offset="80%" stop-color="#80000a" />
      <stop offset="100%" stop-color="#4a0005" />
    </radialGradient>
    <radialGradient id="roseRedDark" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c41e3a" />
      <stop offset="60%" stop-color="#80000a" />
      <stop offset="100%" stop-color="#3d0004" />
    </radialGradient>
    <filter id="shoeGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a2e05" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#shoeGlow)">
    <!-- Horseshoe Outer Arc -->
    <path d="M 32 28 C 32 18, 44 18, 46 28 L 46 64 C 46 88, 56 106, 70 106 C 84 106, 94 88, 94 64 L 94 28 C 96 18, 108 18, 108 28 L 108 64 C 108 98, 92 118, 70 118 C 48 118, 32 98, 32 64 Z"
          fill="url(#goldHorseshoe)" stroke="#805b10" stroke-width="1.8" />

    <!-- Inner Groove / Bevel Line -->
    <path d="M 39 30 L 39 64 C 39 92, 52 110, 70 110 C 88 110, 101 92, 101 64 L 101 30"
          fill="none" stroke="url(#goldInnerRim)" stroke-width="1.6" />

    <!-- Nail Holes (7 Lucky Nail Slots) -->
    <!-- Left Branch -->
    <rect x="36" y="38" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <rect x="36" y="54" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <rect x="38" y="70" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <rect x="42" y="86" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <!-- Right Branch -->
    <rect x="98.5" y="38" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <rect x="98.5" y="54" width="5.5" height="4" rx="1.5" fill="#3a2505" />
    <rect x="96.5" y="70" width="5.5" height="4" rx="1.5" fill="#3a2505" />

    <!-- Ornate Engraving Scroll on Heel Tips -->
    <circle cx="39" cy="24" r="3" fill="#ffe399" stroke="#805b10" stroke-width="1" />
    <circle cx="101" cy="24" r="3" fill="#ffe399" stroke="#805b10" stroke-width="1" />

    <!-- Entwined Crimson Red Roses and Leaves at Bottom-Right (as in reference) -->
    <g transform="translate(68, 62)">
      <!-- Emerald Leaves -->
      <path d="M 12 40 C 26 48, 38 42, 34 26 C 24 24, 16 30, 12 40 Z" fill="#2d5c28" stroke="#163812" stroke-width="1.2" />
      <path d="M -10 38 C -22 46, -32 40, -28 26 C -20 24, -12 30, -10 38 Z" fill="#2d5c28" stroke="#163812" stroke-width="1.2" />
      <path d="M 28 8 C 42 12, 46 -2, 36 -12 C 26 -6, 24 0, 28 8 Z" fill="#3a7034" stroke="#163812" stroke-width="1" />

      <!-- Main Central Red Rose -->
      <circle cx="10" cy="24" r="17" fill="url(#roseRed)" stroke="#4a0005" stroke-width="0.8" />
      <path d="M -2 20 C 0 10, 20 10, 22 20 C 20 32, 0 32, -2 20 Z" fill="#9e1124" />
      <path d="M 2 18 C 4 13, 16 13, 18 18 C 16 26, 4 26, 2 18 Z" fill="#69000a" />
      <circle cx="10" cy="18" r="4" fill="#f03852" />

      <!-- Companion Smaller Rose Blossom -->
      <circle cx="-6" cy="14" r="11" fill="url(#roseRedDark)" stroke="#3d0004" stroke-width="0.6" />
      <circle cx="-6" cy="12" r="6" fill="#a81528" />
      <circle cx="-6" cy="11" r="2.5" fill="#e62e49" />
    </g>
  </g>
</svg>
