<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Rich Crimson Red Ribbon Gradients -->
    <linearGradient id="bowRedMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d92534" />
      <stop offset="45%" stop-color="#b01624" />
      <stop offset="80%" stop-color="#7a0c16" />
      <stop offset="100%" stop-color="#4d050c" />
    </linearGradient>
    <linearGradient id="bowRedHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff5768" />
      <stop offset="50%" stop-color="#d92534" />
      <stop offset="100%" stop-color="#8a0f1b" />
    </linearGradient>
    <linearGradient id="bowGoldFiligree" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa8022" stop-opacity="0" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#fff1ba" />
      <stop offset="75%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8022" stop-opacity="0" />
    </linearGradient>
    <filter id="bowShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#400408" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Left Elegant Filigree Ribbon Line -->
  <path d="M 40,65 C 80,65 110,48 150,50 C 180,52 205,68 225,65" 
        fill="none" stroke="url(#bowGoldFiligree)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="95" cy="58" r="2" fill="#d4af37" />
  <circle cx="165" cy="52" r="2.2" fill="#d4af37" />

  <!-- Right Elegant Filigree Ribbon Line -->
  <path d="M 460,65 C 420,65 390,48 350,50 C 320,52 295,68 275,65" 
        fill="none" stroke="url(#bowGoldFiligree)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="405" cy="58" r="2" fill="#d4af37" />
  <circle cx="335" cy="52" r="2.2" fill="#d4af37" />

  <!-- Centerpiece: Elegant Red Ribbon Bow -->
  <g filter="url(#bowShadow)">
    <!-- Flowing Ribbon Tails (Back) -->
    <!-- Left Tail -->
    <path d="M 244,68 C 238,82 225,98 214,108 C 224,105 233,103 241,105 C 248,93 251,80 250,68 Z" 
          fill="url(#bowRedMain)" opacity="0.95" />
    <!-- Right Tail -->
    <path d="M 256,68 C 262,82 275,98 286,108 C 276,105 267,103 259,105 C 252,93 249,80 250,68 Z" 
          fill="url(#bowRedMain)" opacity="0.95" />

    <!-- Left Bow Loop Outer -->
    <path d="M 246,55 C 235,38 208,30 192,42 C 178,53 182,72 202,78 C 218,83 236,70 246,62 Z" 
          fill="url(#bowRedMain)" stroke="#5c060d" stroke-width="0.8" />
    <!-- Left Bow Loop Inner Fold / Shadow -->
    <path d="M 205,48 C 215,44 232,50 242,56 C 234,64 218,68 208,62 C 200,56 201,50 205,48 Z" 
          fill="url(#bowRedHighlight)" />

    <!-- Right Bow Loop Outer -->
    <path d="M 254,55 C 265,38 292,30 308,42 C 322,53 318,72 298,78 C 282,83 264,70 254,62 Z" 
          fill="url(#bowRedMain)" stroke="#5c060d" stroke-width="0.8" />
    <!-- Right Bow Loop Inner Fold / Shadow -->
    <path d="M 295,48 C 285,44 268,50 258,56 C 266,64 282,68 292,62 C 300,56 299,50 295,48 Z" 
          fill="url(#bowRedHighlight)" />

    <!-- Central Ribbon Knot -->
    <ellipse cx="250" cy="58" rx="8.5" ry="9.5" fill="url(#bowRedHighlight)" stroke="#4d050c" stroke-width="0.9" />
    <!-- Knot Highlight Crease -->
    <path d="M 247,52 C 248,56 248,60 247,64" stroke="#ff8090" stroke-width="1.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Little Golden Sparkles -->
  <circle cx="250" cy="24" r="2.2" fill="#d4af37" />
  <circle cx="230" cy="30" r="1.5" fill="#fff1ba" />
  <circle cx="270" cy="30" r="1.5" fill="#fff1ba" />
</svg>
