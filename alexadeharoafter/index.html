  <!-- Favicon / Apple Touch Icon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=2.0.0" />
</head>

<body class="theme-light">

  <!-- Ambient stardust canvas -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Main Single-Page Unscrollable Stage -->
  <main class="page-container">

    <article class="invitation-card" id="invitation-card">

      <!-- Light Blue Corner Floral Bouquets (Overflow visible so never clipped) -->
      <div class="card-floral floral-top-left" aria-hidden="true">
        <img src="photos/rose-corner-tl.png?v=3" alt="" class="floral-img" />
      </div>
      <div class="card-floral floral-bottom-right" aria-hidden="true">
        <img src="photos/rose-corner-br.png?v=3" alt="" class="floral-img" />
      </div>

      <!-- Outer & Inner Gold Filigree Borders -->
      <div class="card-frame-border" aria-hidden="true">
        <div class="corner-filigree cf-top-left"></div>
        <div class="corner-filigree cf-top-right"></div>
        <div class="corner-filigree cf-bottom-left"></div>
        <div class="corner-filigree cf-bottom-right"></div>
      </div>

      <!-- Inner Card Content Stack -->
      <div class="card-inner-content">

        <!-- 1. Header Typography -->
        <header class="card-header">
          <p class="card-supertitle">QUINCEAÑERA</p>
          <h1 class="card-title-main">
            <span class="title-bold">AFTER</span>
            <span class="title-script">Party</span>
          </h1>
          <p class="card-subtitle">CELEBRATION</p>
          <div class="fleuron-divider" aria-hidden="true">✦ &nbsp; ❦ &nbsp; ✦</div>
          <p class="card-honoring">HONORING</p>
          <h2 class="celebrant-name">Alexa S.<br />Laco Deharo</h2>
        </header>

        <!-- 2. Celebrant Portrait Arch (Archway Tile Floor Image) -->
        <section class="portrait-section" aria-label="Photo of Alexa">
          <div class="portrait-arch-frame">
            <img src="photos/celebrant.jpg?v=6" alt="Alexa S. Laco Deharo in teal gown" class="portrait-img" />
          </div>
        </section>

        <!-- 3. Event Date Banner -->
        <section class="date-banner-section" aria-label="Event Date">
          <div class="date-banner-line"></div>
          <p class="date-banner-text">SATURDAY &bull; JANUARY 30, 2027</p>
          <div class="date-banner-line"></div>
        </section>

        <!-- 4. Venue Section (Exact Reference Layout from Main Invite) -->
        <section class="venue-stage-reception" aria-label="Venue Details & Location">
          
          <!-- Left Column: Copy, Big Time & Link -->
          <div class="venue-copy">
            <span class="venue-role-badge">Reception Venue</span>
            <h3 class="venue-title">RANCHO VISTA GOLF CLUB</h3>
            <p class="venue-address">
              3905 Club Rancho Dr<br />Palmdale, CA 93551
            </p>

            <div class="venue-time-divider"></div>
            <div class="venue-big-time">6:30 PM – 11:00 PM</div>
            <div class="venue-time-divider"></div>

            <a href="https://www.google.com/maps/search/?api=1&amp;query=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              data-apple-url="https://maps.apple.com/?q=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              id="map-link-btn" target="_blank" rel="noopener noreferrer" class="venue-open-maps-link"
              aria-label="Open directions to Rancho Vista Golf Club">
              <span>OPEN IN MAPS &rarr;</span>
            </a>
          </div>

          <!-- Right Column: Arch Venue Photo with Gold Tiara Crest -->
          <div class="venue-arch-container">
            <div class="venue-crown-accent" aria-hidden="true">
              <img src="photos/crown-flourish.svg" alt="" width="52" height="36" />
            </div>
            <a href="https://www.google.com/maps/search/?api=1&amp;query=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              data-apple-url="https://maps.apple.com/?q=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              target="_blank" rel="noopener noreferrer" class="venue-map-arch"
              aria-label="Rancho Vista Golf Club location">
              <img src="photos/venue-reception.jpg" alt="Rancho Vista Golf Club" class="venue-arch-img" />
            </a>
          </div>

        </section>

      </div><!-- /.card-inner-content -->

    </article><!-- /.invitation-card -->

  </main>

  <script src="main.js?v=2.0.0"></script>
</body>

</html>
