  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

    rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=4.0.0" />

<body class="theme-light">

  <!-- Ambient background canvas -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Main Container: Stretched top to bottom like a sheet of paper -->
  <main class="page-container">

    <article class="invitation-card paper-sheet" id="invitation-card">

      <!-- Light Blue Corner Floral Bouquets (Resting on paper edges without borders) -->
      <div class="card-floral floral-top-left" aria-hidden="true">
        <img src="photos/rose-corner-tl.png?v=3" alt="" class="floral-img" />
      </div>
      <div class="card-floral floral-bottom-right" aria-hidden="true">
        <img src="photos/rose-corner-br.png?v=3" alt="" class="floral-img" />
      </div>

      <!-- Inner Content -->
      <div class="card-inner-content">

        <!-- Headline Typography -->
        <header class="card-header">
          <p class="card-supertitle">QUINCEAÑERA</p>
          <h1 class="card-title-main">
            <span class="title-bold">AFTER</span>
            <span class="title-script">Party</span>
          </h1>
          <p class="card-subtitle">CELEBRATION</p>
          <div class="fleuron-divider" aria-hidden="true">✦ &nbsp; ❦ &nbsp; ✦</div>
          <p class="card-honoring">HONORING</p>
          <h2 class="celebrant-name">Alexa S.<br />Laco Deharo</h2>
        </header>

        <!-- Celebrant Portrait Arch (Archway Tile Floor Image) -->
        <section class="portrait-section" aria-label="Photo of Alexa">
          <div class="portrait-arch-frame">
            <img src="photos/celebrant.jpg?v=6" alt="Alexa S. Laco Deharo in teal gown" class="portrait-img" />
          </div>
        </section>

        <!-- Event Details: Date -->
        <section class="details-section" aria-label="Event Date">
          <p class="event-day-name">SATURDAY</p>
          <div class="date-badge-row">
            <span class="date-badge-month">JANUARY</span>
            <span class="date-badge-num">30</span>
            <span class="date-badge-year">2027</span>
          </div>
          <div class="fleuron-divider small-fleuron" aria-hidden="true">✦ &nbsp; ❦ &nbsp; ✦</div>
        </section>

        <!-- Venue Section with Golf Club Photo and Obvious Big Time (Matching Main Invite Design) -->
        <section class="venue-section" aria-label="Venue and Time">
          
          <div class="venue-stage venue-stage-reception">
            
            <!-- Left: Venue details & Prominent Time between gold hairlines -->
            <div class="venue-copy">
              <div class="venue-header-row">
                <span class="venue-role-badge">Reception Venue</span>
                <span class="venue-sparkle" aria-hidden="true">✦</span>
              </div>
              <h3 class="venue-title">RANCHO VISTA<br />GOLF CLUB</h3>
              <p class="venue-address">3905 Club Rancho Dr<br />Palmdale, CA 93551</p>

              <!-- Prominent, Obvious Big Time (between two gold hairlines) -->
              <div class="venue-time-tag">
                <span>6:30 PM &ndash; 11:00 PM</span>
              </div>

              <!-- Quiet Underlined Map Link (Open in Maps) -->
              <a href="https://www.google.com/maps/search/?api=1&amp;query=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
                data-apple-url="https://maps.apple.com/?q=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
                id="map-link-btn" target="_blank" rel="noopener noreferrer" class="venue-elegant-map-btn"
                aria-label="Open Rancho Vista Golf Club in Maps">
                <span>OPEN IN MAPS</span>
                <span class="arrow-char" aria-hidden="true">&rarr;</span>
              </a>
            </div>

            <!-- Right: Rancho Vista Golf Club Photo in Arch with Gold Tiara Crest -->
            <div class="venue-arch-container">
              <div class="venue-crown-accent" aria-hidden="true">
                <img src="photos/crown-flourish.svg" alt="" width="56" height="38" />
              </div>
              <a href="https://www.google.com/maps/search/?api=1&amp;query=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
                data-apple-url="https://maps.apple.com/?q=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
                target="_blank" rel="noopener noreferrer" class="venue-map-arch venue-photo-arch"
                aria-label="Rancho Vista Golf Club on Maps">
                <img src="photos/venue-reception.jpg" alt="Rancho Vista Golf Club" class="venue-arch-img reception-photo" />
              </a>
            </div>

          </div>

        </section>

      </div><!-- /.card-inner-content -->

    </article><!-- /.invitation-card -->

  </main>

  <script src="main.js?v=4.0.0"></script>
</body>

</html>
