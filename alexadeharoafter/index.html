<body class="theme-light">

  <!-- Ambient background canvas -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Main Container -->
  <main class="page-container">

    <article class="editorial-card" id="invitation-card">

      <!-- ── PORTRAIT PANEL (Left on Desktop / Top on Mobile) ── -->
      <section class="editorial-media-panel" aria-label="Photo of Alexa">
        <img src="photos/celebrant.jpg?v=6" alt="Alexa S. Laco Deharo in teal gown" class="editorial-portrait-img" />
        <div class="editorial-portrait-overlay" aria-hidden="true"></div>
        <div class="editorial-gold-seam" aria-hidden="true"></div>
      </section>

      <!-- ── STATIONERY CONTENT PANEL (Right on Desktop / Bottom on Mobile) ── -->
      <section class="editorial-content-panel" aria-label="Event Details">
        
        <!-- Corner Roses -->
        <div class="panel-floral floral-tr" aria-hidden="true">
          <img src="photos/rose-corner-tr.png?v=3" alt="" class="floral-img" />
        </div>
        <div class="panel-floral floral-br" aria-hidden="true">
          <img src="photos/rose-corner-br.png?v=3" alt="" class="floral-img" />
        </div>

        <div class="panel-inner">
          
          <!-- Header -->
          <header class="panel-header">
            <p class="panel-supertitle">QUINCEAÑERA</p>
            <h1 class="panel-title-main">
              <span class="title-bold">AFTER</span>
              <span class="title-script">Party</span>
            </h1>
            <p class="panel-subtitle">CELEBRATION</p>
            <div class="panel-fleuron" aria-hidden="true">✦ &nbsp; ❦ &nbsp; ✦</div>
          </header>

          <!-- Honoring / Name -->
          <div class="panel-honoring-block">
            <p class="panel-honoring-label">HONORING</p>
            <h2 class="panel-celebrant-name">Alexa S. Laco Deharo</h2>
          </div>

          <!-- Date Badge Box -->
          <div class="panel-date-box">
            <span class="panel-date-item">SATURDAY</span>
            <span class="panel-date-dot" aria-hidden="true">✦</span>
            <span class="panel-date-item">JANUARY 30, 2027</span>
          </div>

          <!-- Obvious Big Bold Black Time -->
          <div class="panel-time-highlight">
            <span>6:30 PM &ndash; 11:00 PM</span>
          </div>

          <!-- Venue & Directions -->
          <footer class="panel-venue-footer">
            <div class="panel-venue-row">
              <span class="venue-main-name">Rancho Vista Golf Club</span>
              <span class="venue-separator" aria-hidden="true">✦</span>
              <span class="venue-city">Palmdale, CA</span>
            </div>
            <p class="panel-venue-address">3905 Club Rancho Dr</p>

            <a href="https://www.google.com/maps/search/?api=1&amp;query=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              data-apple-url="https://maps.apple.com/?q=Rancho+Vista+Golf+Club,+3905+Club+Rancho+Dr,+Palmdale,+CA+93551"
              id="map-link-btn" target="_blank" rel="noopener noreferrer" class="panel-map-btn"
              aria-label="Open Rancho Vista Golf Club in Maps">
              <span>OPEN IN MAPS</span>
              <span class="arrow-char" aria-hidden="true">&rarr;</span>
            </a>
          </footer>

        </div><!-- /.panel-inner -->

      </section><!-- /.editorial-content-panel -->

    </article><!-- /.editorial-card -->

  </main>

  <script src="main.js?v=4.0.0"></script>
