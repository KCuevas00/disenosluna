<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Preview Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #c5e4ee;
      font-family: 'Montserrat', sans-serif;
    }
    .og-container {
      width: 1200px;
      height: 630px;
      display: flex;
      position: relative;
      background: #fdfbf7 radial-gradient(ellipse at 70% 30%, #ffffff 0%, #fdfbf7 60%, #f4ede1 100%);
    }

    /* ── LEFT SIDE: Full-Bleed Portrait of Alexa ── */
    .og-left {
      width: 520px;
      height: 630px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: #072a35;
    }
    .og-portrait-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 28%;
      display: block;
    }
    .og-portrait-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(7,42,53,0.08) 0%, rgba(7,42,53,0) 70%, rgba(253,251,247,0.85) 98%, rgba(253,251,247,1) 100%);
      pointer-events: none;
    }
    .og-gold-seam {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 3px;
      background: linear-gradient(180deg, #fdf5e2 0%, #c99f57 30%, #8c6f23 70%, #c99f57 100%);
      box-shadow: 0 0 14px rgba(201, 159, 87, 0.7);
      z-index: 5;
    }

    /* ── RIGHT SIDE: "You're Invited to the After Party" ── */
    .og-right {
      flex: 1;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px 70px;
      z-index: 2;
    }

    /* Corner Blue Roses */
    .og-corner-tr {
      position: absolute;
      top: 0;
      right: 0;
      width: 180px;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(7, 42, 53, 0.12));
    }
    .og-corner-br {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 185px;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(7, 42, 53, 0.12));
    }

    /* Typography Hierarchy */
    .og-supertitle {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #c99f57;
      margin-bottom: 8px;
    }

    .og-invited-script {
      font-family: 'Alex Brush', cursive;
      font-size: 5.4rem;
      font-weight: 400;
      color: #008eb7;
      line-height: 1;
      margin-bottom: 2px;
      text-shadow: 0 2px 14px rgba(0, 142, 183, 0.25);
    }

    .og-to-the {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #072a35;
      margin: 6px 0 10px;
    }

    .og-title-main {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 14px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .og-title-bold {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 4.2rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #072a35;
    }

    .og-title-script {
      font-family: 'Alex Brush', cursive;
      font-size: 5.2rem;
      font-weight: 400;
      color: #008eb7;
      transform: rotate(-3deg);
      display: inline-block;
    }

    .og-fleuron {
      font-size: 1.1rem;
      letter-spacing: 0.35em;
      color: #c99f57;
      margin: 10px 0 16px;
      opacity: 0.9;
    }

    .og-celebrant-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .og-celebrant-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.36em;
      text-transform: uppercase;
      color: #537582;
    }

    .og-celebrant-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #072a35;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <div class="og-container">
    
    <!-- LEFT: Alexa Photo -->
    <div class="og-left">
      <img src="photos/celebrant.jpg" alt="Alexa S. Laco Deharo" class="og-portrait-img">
      <div class="og-portrait-overlay"></div>
      <div class="og-gold-seam"></div>
    </div>

    <!-- RIGHT: "You're Invited to the After Party" -->
    <div class="og-right">
      <img src="photos/rose-corner-tr.png" alt="" class="og-corner-tr">
      <img src="photos/rose-corner-br.png" alt="" class="og-corner-br">

      <p class="og-supertitle">QUINCEAÑERA</p>
      
      <div class="og-invited-script">You're Invited</div>
      
      <p class="og-to-the">TO THE</p>
      
      <div class="og-title-main">
        <span class="og-title-bold">AFTER</span>
        <span class="og-title-script">Party</span>
      </div>

      <div class="og-fleuron" aria-hidden="true">✦ &nbsp; ❦ &nbsp; ✦</div>

      <div class="og-celebrant-row">
        <span class="og-celebrant-label">HONORING</span>
        <span class="og-celebrant-name">Alexa S. Laco Deharo</span>
      </div>

    </div>

  </div>
</body>
</html>
